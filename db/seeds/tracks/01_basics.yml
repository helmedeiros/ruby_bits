---
slug: basics
name: Ruby Basics
description: From values to methods — the building blocks every Ruby program needs.
position: 1
modules:
- slug: values
  name: Values
  overview: |
    Almost everything in Ruby is an object — including numbers, strings,
    symbols, true, false, and nil. Knowing how each behaves saves you
    from surprises later.
  lessons:
  - slug: numbers
    title: Numbers
    body: |
      ## Numbers

      Ruby has two number types you'll meet first: **integers** and
      **floats**. They look similar but behave differently in subtle
      ways. Let's walk through the basics and then look at the gotchas.

      ### Integers

      Whole numbers, with no decimal point:

      ```ruby
      42
      -17
      1_000_000   # underscores are allowed for readability
      ```

      All the arithmetic you'd expect:

      ```ruby
      2 + 3       # => 5
      10 - 4      # => 6
      7 * 6       # => 42
      20 / 4      # => 5
      17 % 5      # => 2   (modulo / remainder)
      2 ** 10     # => 1024  (exponent)
      ```

      ### Floats

      Decimal numbers:

      ```ruby
      3.14
      -0.5
      1.5e3       # scientific notation: 1500.0
      ```

      Floats follow the IEEE-754 standard, so you get the usual
      floating-point quirks:

      ```ruby
      0.1 + 0.2    # => 0.30000000000000004  (not exactly 0.3)
      ```

      For money or anything where exactness matters, use `BigDecimal`
      or work in cents (integers).

      ### Integer division

      Here's the most common surprise. Dividing two integers in Ruby
      **truncates** — you get an integer back, not a float:

      ```ruby
      5 / 2       # => 2     (not 2.5!)
      7 / 3       # => 2
      -7 / 3      # => -3    (rounds toward negative infinity)
      ```

      To get a float result, **make at least one operand a float**:

      ```ruby
      5 / 2.0     # => 2.5
      5.0 / 2     # => 2.5
      5.fdiv(2)   # => 2.5   (float division explicitly)
      ```

      ### Useful methods

      ```ruby
      -7.abs           # => 7
      3.14.round       # => 3
      3.14.round(1)    # => 3.1
      3.14.floor       # => 3
      3.14.ceil        # => 4
      42.to_s          # => "42"
      "42".to_i        # => 42
      "3.14".to_f      # => 3.14
      42.even?         # => true
      7.odd?           # => true
      7.zero?          # => false
      0.zero?          # => true
      ```

      ### Predicates and ranges

      `between?` and the comparison family are common:

      ```ruby
      age = 25
      age.between?(18, 65)   # => true
      age >= 18 && age < 65  # equivalent
      ```
    activities:
    - title: Even or odd?
      kind: code
      difficulty: 1
      prompt: Write `parity(n)` that returns the string `"even"` or `"odd"`.
      starter_code: |
        def parity(n)
          # TODO
        end
      solution: |
        def parity(n)
          n.even? ? "even" : "odd"
        end
      spec_code: |
        raise unless parity(4) == "even"
        raise unless parity(7) == "odd"
        raise unless parity(0) == "even"
        raise unless parity(-3) == "odd"
    - title: Watch out for integer division
      kind: choice
      difficulty: 1
      prompt: What does `5 / 2` evaluate to in Ruby?
      choices:
        a: '2.5'
        b: '2'
        c: '2.0'
        d: It raises an error
      correct_choice: b
    - title: Force a float division
      kind: code
      difficulty: 2
      prompt: Write `average(nums)` that returns the arithmetic mean of an integer
        array as a `Float`. For an empty array, return `0.0`.
      starter_code: |
        def average(nums)
          # TODO
        end
      solution: |
        def average(nums)
          return 0.0 if nums.empty?
          nums.sum.to_f / nums.size
        end
      spec_code: |
        raise unless average([1, 2, 3, 4]) == 2.5
        raise unless average([10])         == 10.0
        raise unless average([])           == 0.0
        raise unless average([1, 2]).is_a?(Float)
    - title: Round a price
      kind: code
      difficulty: 2
      prompt: Write `format_price(amount)` that rounds the float `amount` to 2 decimal
        places and prefixes a `$`. `format_price(3.149)` should return `"$3.15"`.
      starter_code: |
        def format_price(amount)
          # TODO
        end
      solution: |
        def format_price(amount)
          "$#{amount.round(2)}"
        end
      spec_code: |
        raise unless format_price(3.149) == "$3.15"
        raise unless format_price(10.0)  == "$10.0"
        raise unless format_price(0.005).start_with?("$")
    - title: FizzBuzz
      kind: code
      difficulty: 3
      prompt: Write `fizzbuzz(n)` that returns `"FizzBuzz"` if n is divisible by 15,
        `"Fizz"` if by 3, `"Buzz"` if by 5, otherwise the number as a string. Use
        `%`.
      starter_code: |
        def fizzbuzz(n)
          # TODO
        end
      solution: |
        def fizzbuzz(n)
          return "FizzBuzz" if n % 15 == 0
          return "Fizz"     if n % 3  == 0
          return "Buzz"     if n % 5  == 0
          n.to_s
        end
      spec_code: |
        raise unless fizzbuzz(15) == "FizzBuzz"
        raise unless fizzbuzz(9)  == "Fizz"
        raise unless fizzbuzz(10) == "Buzz"
        raise unless fizzbuzz(7)  == "7"
        raise unless fizzbuzz(30) == "FizzBuzz"
  - slug: strings-and-symbols
    title: Strings and symbols
    body: |
      ## Strings and symbols

      Ruby gives you two kinds of textual values, and beginners often
      confuse them. Let's go through each carefully.

      ### Strings

      A **string** is a sequence of characters. You create one with
      quotes:

      ```ruby
      greeting = "hello"
      name     = "alice"
      ```

      Strings can be combined with `+`, repeated with `*`, and asked
      their length:

      ```ruby
      "hi" + " " + "alice"   # => "hi alice"
      "ha" * 3               # => "hahaha"
      "alice".length         # => 5
      ```

      The most useful trick is **interpolation** — embedding values
      right inside a string with `#{...}`. Note this only works
      inside *double* quotes:

      ```ruby
      name = "alice"
      "hello, #{name}"        # => "hello, alice"
      'hello, #{name}'        # => 'hello, #{name}'  — no interpolation!
      ```

      Strings have many methods you'll use constantly:

      ```ruby
      "Alice".upcase          # => "ALICE"
      "Alice".downcase        # => "alice"
      "  hi  ".strip          # => "hi"
      "hello".include?("ll")  # => true
      "hello".reverse         # => "olleh"
      ```

      ### Symbols

      A **symbol** looks like `:name`. It's an immutable label — Ruby
      guarantees the same symbol always refers to the same object in
      memory. Symbols are cheap to compare and never accidentally
      mutate.

      ```ruby
      :pending
      :status
      :user_id
      ```

      Symbols and strings are not interchangeable: `:name` is not
      `"name"`. They look similar in the source but behave differently.

      ### When to use which?

      - Use **symbols** for fixed identifiers that name a *kind* of
        thing: hash keys, states (`:pending`, `:active`), method
        names. They're not for display.
      - Use **strings** for human-facing text — anything you'd print,
        log, store, or send over the wire.

      ### Common pitfall: quote style

      A common beginner bug is wondering why interpolation "doesn't
      work" — usually the wrong quote was used. Single quotes are
      literal; double quotes interpolate.
    activities:
    - title: Interpolate a greeting
      kind: code
      difficulty: 1
      prompt: |
        Write `greet(name)` so it returns `"hi, NAME!"` with the
        name uppercased. For `greet("alice")` you should get
        `"hi, ALICE!"`.
      starter_code: |
        def greet(name)
          # TODO
        end
      solution: |
        def greet(name)
          "hi, #{name.upcase}!"
        end
      spec_code: |
        raise unless greet("alice") == "hi, ALICE!"
        raise unless greet("bob")   == "hi, BOB!"
    - title: Word count
      kind: code
      difficulty: 1
      prompt: |
        Write `word_count(sentence)` that returns the number of
        words in a sentence (separated by spaces).
        Hint: strings have a `.split` method that returns an array.
      starter_code: |
        def word_count(sentence)
          # TODO
        end
      solution: |
        def word_count(sentence)
          sentence.split.length
        end
      spec_code: |
        raise unless word_count("hello world") == 2
        raise unless word_count("the quick brown fox") == 4
        raise unless word_count("solo") == 1
    - title: Symbol or string?
      kind: choice
      difficulty: 1
      prompt: |
        You're storing the status of an order. It can be one of a
        small fixed set of values: pending, paid, shipped,
        cancelled. What's the most idiomatic Ruby representation?
      choices:
        a: '"pending", "paid", "shipped", "cancelled" (strings)'
        b: ":pending, :paid, :shipped, :cancelled (symbols)"
        c: 0, 1, 2, 3 (integers)
        d: '"PENDING", "PAID", "SHIPPED", "CANCELLED" (uppercase strings)'
      correct_choice: b
    - title: Spot the bug
      kind: choice
      difficulty: 2
      prompt: |
        A beginner wrote `puts 'hello, #{name}'` and is confused
        that the output is literally `hello, #{name}` instead of
        their name. What's the fix?
      choices:
        a: They need to capitalize `Name` inside the braces.
        b: Use double quotes instead of single quotes.
        c: Add `puts` twice.
        d: Use `printf` instead of `puts`.
      correct_choice: b
    - title: Build a slug
      kind: code
      difficulty: 2
      prompt: |
        Write `slugify(title)` that returns a URL-safe lowercase
        string with spaces replaced by `-`. `"Hello World"` becomes
        `"hello-world"`.
      starter_code: |
        def slugify(title)
          # TODO
        end
      solution: |
        def slugify(title)
          title.downcase.gsub(" ", "-")
        end
      spec_code: |
        raise unless slugify("Hello World") == "hello-world"
        raise unless slugify("MY First Post") == "my-first-post"
        raise unless slugify("ruby") == "ruby"
  - slug: truthy-falsy
    title: Truthy and falsy
    body: |
      ## Truthy and falsy

      When Ruby decides whether to enter an `if` branch, it doesn't
      ask "is this true or false?" — it asks "is this truthy?". Two
      values are **falsy**: `false` and `nil`. **Everything else is
      truthy**, including some values that surprise people coming
      from other languages.

      ### The rule

      ```ruby
      puts "truthy" if 0       # prints "truthy"  — zero is truthy
      puts "truthy" if ""      # prints "truthy"  — empty string is truthy
      puts "truthy" if []      # prints "truthy"  — empty array is truthy
      puts "truthy" if {}      # prints "truthy"  — empty hash is truthy
      puts "truthy" if nil     # prints nothing   — nil is falsy
      puts "truthy" if false   # prints nothing   — false is falsy
      ```

      This is different from JavaScript or Python, where `0`, `""`,
      and empty containers are falsy. Ruby is stricter: only `nil`
      and `false` are falsy.

      ### Why nil exists

      `nil` is Ruby's "nothing here" value. Methods that don't find
      what they were looking for return `nil`:

      ```ruby
      [1, 2, 3].find { |n| n > 100 }   # => nil
      {a: 1}[:missing_key]              # => nil
      ```

      So `if value` is a common shorthand for "did we find
      something?":

      ```ruby
      user = User.find_by(email: "x")
      if user
        puts "welcome, #{user.name}"
      end
      ```

      ### Common pitfall: confusing nil and false

      Both `nil` and `false` are falsy, so you often can't tell them
      apart in an `if`. If the difference matters (e.g. "user
      explicitly said no" vs "user didn't say"), use `.nil?`:

      ```ruby
      value.nil?       # true only for nil, not for false
      ```
    activities:
    - title: Spot the falsy
      kind: choice
      difficulty: 1
      prompt: Which value is FALSY in Ruby?
      choices:
        a: '0'
        b: '"" (empty string)'
        c: nil
        d: "[] (empty array)"
      correct_choice: c
    - title: How many truthy?
      kind: choice
      difficulty: 2
      prompt: |
        How many of these values are truthy?
        0, "", [], nil, false, "false"
      choices:
        a: '2'
        b: '3'
        c: '4'
        d: '5'
      correct_choice: c
    - title: Default when missing
      kind: code
      difficulty: 2
      prompt: |
        Write `display_name(name)` that returns the name if it's
        not nil, or `"anonymous"` if it is. Use the `||` operator.
      starter_code: |
        def display_name(name)
          # TODO
        end
      solution: |
        def display_name(name)
          name || "anonymous"
        end
      spec_code: |
        raise unless display_name("alice")     == "alice"
        raise unless display_name(nil)         == "anonymous"
        raise unless display_name("")          == ""
    - title: Telling nil and false apart
      kind: code
      difficulty: 3
      prompt: |
        Write `describe(value)` that returns `"missing"` if value
        is nil, `"off"` if value is false, and `"set"` for anything
        else.
      starter_code: |
        def describe(value)
          # TODO
        end
      solution: |
        def describe(value)
          return "missing" if value.nil?
          return "off"     if value == false
          "set"
        end
      spec_code: |
        raise unless describe(nil)   == "missing"
        raise unless describe(false) == "off"
        raise unless describe(true)  == "set"
        raise unless describe(0)     == "set"
        raise unless describe("")    == "set"
  - slug: comparison-operators
    title: Comparison operators
    body: |
      ## Comparison operators

      Ruby gives you several operators for comparing values. They look
      familiar from other languages, but a few behave subtly differently.

      ### Equality: `==`, `eql?`, `equal?`

      - `==` is **value equality**. Most code uses this.
      - `eql?` is **stricter** — same value AND same type. `1 == 1.0` is
        `true`, but `1.eql?(1.0)` is `false` (Integer vs Float).
      - `equal?` is **identity** — the same object in memory. Rarely used
        directly; don't override it.

      ```ruby
      1 == 1.0          # => true
      1.eql?(1.0)       # => false
      "hi".equal?("hi") # => false  (two different String objects)
      ```

      ### Ordering: `<`, `<=`, `>`, `>=`

      Numbers and strings (and dates, and many other types) order
      themselves the natural way:

      ```ruby
      3 < 5             # => true
      "alice" < "bob"   # => true   (string compare is alphabetical)
      ```

      ### The spaceship: `<=>`

      `<=>` returns `-1`, `0`, or `1` depending on whether the left side is
      less than, equal to, or greater than the right:

      ```ruby
      1 <=> 2     # => -1
      2 <=> 2     # =>  0
      3 <=> 2     # =>  1
      ```

      This is the operator `sort` uses, and the one you'd implement in your
      own class to plug into `Comparable`.

      ### `between?`

      Shortcut for "is the value between two bounds, inclusive":

      ```ruby
      age = 25
      age.between?(18, 65)    # => true
      ```

      ### Pitfall: assignment vs equality

      `=` assigns. `==` compares. Mixing them up is a classic bug:

      ```ruby
      if x = 5     # assigns 5 to x — always truthy!
      if x == 5    # compares x to 5
      ```
    activities:
    - title: Strict equality
      kind: choice
      difficulty: 1
      prompt: Which of these returns `false` in Ruby?
      choices:
        a: 1 == 1.0
        b: 1.eql?(1.0)
        c: '"a" == "a"'
        d: 0 == 0
      correct_choice: b
    - title: Min of three
      kind: code
      difficulty: 1
      prompt: Write `min3(a, b, c)` that returns the smallest of three numbers. Use
        `<` directly, no built-in `min`.
      starter_code: |
        def min3(a, b, c)
          # TODO
        end
      solution: |
        def min3(a, b, c)
          m = a
          m = b if b < m
          m = c if c < m
          m
        end
      spec_code: |
        raise unless min3(1, 2, 3) == 1
        raise unless min3(3, 2, 1) == 1
        raise unless min3(2, 1, 3) == 1
        raise unless min3(5, 5, 5) == 5
    - title: Sort with spaceship
      kind: code
      difficulty: 2
      prompt: Write `compare_lengths(a, b)` that returns `-1`, `0`, or `1` depending
        on whether `a`'s length is less than, equal to, or greater than `b`'s. Use
        the spaceship operator.
      starter_code: |
        def compare_lengths(a, b)
          # TODO
        end
      solution: |
        def compare_lengths(a, b)
          a.length <=> b.length
        end
      spec_code: |
        raise unless compare_lengths("hi", "hello")   == -1
        raise unless compare_lengths("abc", "def")     == 0
        raise unless compare_lengths("hello", "hi")    == 1
  - slug: boolean-operators
    title: Boolean operators
    body: |
      ## Boolean operators

      Ruby has three boolean operators: `&&` (and), `||` (or), `!` (not).
      They look like other languages — but two things make them more useful
      than the basics suggest.

      ### Short-circuit

      Both `&&` and `||` stop as soon as the result is known.

      ```ruby
      false && expensive_call    # expensive_call never runs
      true  || expensive_call    # expensive_call never runs
      ```

      Use this to guard expensive or nil-prone work:

      ```ruby
      user && user.admin?        # safe: stops at nil
      ```

      ### They return values, not just true/false

      This is the part that trips up newcomers. `||` returns the **first
      truthy operand**, not literally `true`:

      ```ruby
      nil   || "default"      # => "default"
      false || "default"      # => "default"
      "alice" || "default"    # => "alice"   (first truthy stops the chain)
      ```

      And `&&` returns the **last truthy operand** (or the first falsy one):

      ```ruby
      "a" && "b" && "c"       # => "c"
      "a" && nil && "c"       # => nil
      ```

      This makes `||` perfect for default values:

      ```ruby
      name = input || "anonymous"
      ```

      ### `!` — logical NOT

      ```ruby
      !true       # => false
      !false      # => true
      !nil        # => true     (nil is falsy, so !nil is true)
      !"hello"    # => false    ("hello" is truthy)
      ```

      ### Pitfall: `||=` is not always "if nil"

      `x ||= y` means `x = x || y`. It assigns `y` to `x` **only when `x`
      is falsy** — i.e. `nil` or `false`. If `false` is a meaningful value,
      use `defined?` instead.

      ### `and` / `or` / `not` keywords

      Ruby also has English versions, but they have **much lower
      precedence** than `&&`/`||`/`!`, which can lead to surprises. Stick
      with the symbols unless you have a specific reason.
    activities:
    - title: What does || return?
      kind: choice
      difficulty: 1
      prompt: What does `nil || "fallback"` return?
      choices:
        a: 'true'
        b: '"fallback"'
        c: nil
        d: 'false'
      correct_choice: b
    - title: Memoized result
      kind: code
      difficulty: 2
      prompt: Write a class `Cache` whose `#value` returns `42` on the first call
        and the same cached value on every later call. Use `||=`.
      starter_code: |
        class Cache
          def value
            # TODO
          end
        end
      solution: |
        class Cache
          def value
            @value ||= 42
          end
        end
      spec_code: |
        c = Cache.new
        raise unless c.value == 42
        # Mutate the ivar to prove the second call returned the cached one
        c.instance_variable_set(:@value, 99)
        raise unless c.value == 99
    - title: Safe chain
      kind: code
      difficulty: 3
      prompt: Write `country_code(user)` that returns `user.profile.country` if both
        `user` and `user.profile` are truthy, otherwise `"XX"`. Use `&&` to short-circuit.
      starter_code: |
        def country_code(user)
          # TODO
        end
      solution: |
        def country_code(user)
          (user && user.profile && user.profile.country) || "XX"
        end
      spec_code: |
        Profile = Struct.new(:country)
        User    = Struct.new(:profile)
        raise unless country_code(User.new(Profile.new("BR"))) == "BR"
        raise unless country_code(User.new(nil))                == "XX"
        raise unless country_code(nil)                          == "XX"
- slug: collections
  name: Collections
  overview: |
    Arrays and hashes are the workhorses of Ruby. Arrays store ordered
    elements indexed by integer; hashes store key/value pairs.
  lessons:
  - slug: arrays
    title: Arrays
    body: |
      ## Arrays

      An **array** is an ordered list of values. Indexes start at
      `0`. Arrays can hold anything — numbers, strings, even other
      arrays — and they can mix types.

      ### Creating and indexing

      ```ruby
      fruits = ["apple", "banana", "cherry"]
      fruits[0]     # => "apple"
      fruits[1]     # => "banana"
      fruits[2]     # => "cherry"
      fruits[3]     # => nil   (out of bounds is nil, not an error)
      ```

      Negative indexes count from the end:

      ```ruby
      fruits[-1]    # => "cherry"  (last item)
      fruits[-2]    # => "banana"
      ```

      Useful methods:

      ```ruby
      fruits.first        # => "apple"
      fruits.last         # => "cherry"
      fruits.size         # => 3
      fruits.empty?       # => false
      fruits.include?("banana")   # => true
      ```

      ### Adding and removing

      ```ruby
      fruits << "date"           # append (mutates)
      fruits.push("elderberry")  # same as <<
      fruits.pop                 # removes & returns last
      fruits.shift               # removes & returns first
      fruits.unshift("apricot")  # prepend
      ```

      ### Iterating

      The most common loop pattern in Ruby is `.each`:

      ```ruby
      fruits.each do |fruit|
        puts fruit.upcase
      end
      ```

      When you want to transform every element into a new array, use
      `.map`:

      ```ruby
      lengths = fruits.map { |f| f.length }
      # => [5, 6, 6]
      ```

      When you want to keep only some elements, use `.select`:

      ```ruby
      short = fruits.select { |f| f.length < 6 }
      # => ["apple"]
      ```

      When you want a single value out of a collection (sum,
      product, …), use `.reduce`:

      ```ruby
      [1, 2, 3, 4].reduce(0) { |sum, n| sum + n }   # => 10
      ```

      These four — `each`, `map`, `select`, `reduce` — solve most
      collection problems you'll ever face.
    activities:
    - title: Sum it up
      kind: code
      difficulty: 1
      prompt: |
        Return the sum of an integer array. An empty array should
        return `0`.
      starter_code: |
        def sum(nums)
          # TODO
        end
      solution: |
        def sum(nums)
          nums.reduce(0, :+)
        end
      spec_code: |
        raise unless sum([])           == 0
        raise unless sum([1, 2, 3, 4]) == 10
        raise unless sum([-1, 1])      == 0
    - title: Doubles
      kind: code
      difficulty: 1
      prompt: |
        Write `doubles(nums)` that returns a new array where every
        number has been multiplied by 2. Use `.map`.
      starter_code: |
        def doubles(nums)
          # TODO
        end
      solution: |
        def doubles(nums)
          nums.map { |n| n * 2 }
        end
      spec_code: |
        raise unless doubles([1, 2, 3]) == [2, 4, 6]
        raise unless doubles([])        == []
        raise unless doubles([-1, 0])   == [-2, 0]
    - title: Filter shorts
      kind: code
      difficulty: 2
      prompt: |
        Write `long_words(words)` that returns only the words with
        more than 4 characters.
      starter_code: |
        def long_words(words)
          # TODO
        end
      solution: |
        def long_words(words)
          words.select { |w| w.length > 4 }
        end
      spec_code: |
        raise unless long_words(["hi", "hello", "yes"])      == ["hello"]
        raise unless long_words(["apple", "pear", "orange"]) == ["apple", "orange"]
        raise unless long_words([])                          == []
    - title: First or default
      kind: code
      difficulty: 2
      prompt: |
        Write `first_or(items, default)` that returns the first
        item in the array, or `default` if the array is empty.
      starter_code: |
        def first_or(items, default)
          # TODO
        end
      solution: |
        def first_or(items, default)
          items.first || default
        end
      spec_code: |
        raise unless first_or([1, 2, 3], 0)         == 1
        raise unless first_or([],         "empty")  == "empty"
        raise unless first_or(["a", "b"], "fallback") == "a"
    - title: Unique double
      kind: code
      difficulty: 3
      prompt: |
        Write `unique_doubles(nums)` that doubles every number AND
        removes duplicates from the result. Order doesn't matter.
        Hint: arrays have a `.uniq` method.
      starter_code: |
        def unique_doubles(nums)
          # TODO
        end
      solution: |
        def unique_doubles(nums)
          nums.map { |n| n * 2 }.uniq
        end
      spec_code: |
        raise unless unique_doubles([1, 2, 1, 3]).sort == [2, 4, 6]
        raise unless unique_doubles([5, 5, 5])         == [10]
        raise unless unique_doubles([])                == []
  - slug: hashes
    title: Hashes
    body: |
      ## Hashes

      A **hash** maps keys to values — like a dictionary. Order is
      preserved (since Ruby 1.9) and any object can be a key, but
      symbols are most common.

      ### Creating and reading

      ```ruby
      user = { name: "alice", age: 30, role: :admin }
      user[:name]    # => "alice"
      user[:age]     # => 30
      user[:missing] # => nil   (no error, just nil)
      ```

      The `{ name: "alice" }` shorthand is for symbol keys.
      Equivalent older syntax: `{ :name => "alice" }`.

      ### Writing and updating

      ```ruby
      user[:role] = :viewer    # set or overwrite
      user[:email] = "a@x"     # add a new key

      user.delete(:age)        # remove a key
      user.size                # => 2
      user.keys                # => [:name, :role, :email]
      user.values              # => ["alice", :viewer, "a@x"]
      ```

      ### Default values

      By default, missing keys return `nil`. But sometimes you want
      a *non-nil* default — e.g. counting things:

      ```ruby
      counts = Hash.new(0)         # any missing key returns 0
      counts[:a] += 1
      counts[:a] += 1
      counts[:b] += 1
      counts                       # => {a: 2, b: 1}
      ```

      Without `Hash.new(0)`, the first `counts[:a] += 1` would crash
      because `nil + 1` is an error.

      ### Iterating

      ```ruby
      user.each do |key, value|
        puts "#{key}: #{value}"
      end
      ```

      Hashes have the same `map`, `select`, `reduce` family as
      arrays, but each block gets `key, value`.
    activities:
    - title: Build a profile
      kind: code
      difficulty: 1
      prompt: |
        Write `profile(name, age)` that returns a hash with
        symbol keys `:name` and `:age` set to the arguments.
      starter_code: |
        def profile(name, age)
          # TODO
        end
      solution: |
        def profile(name, age)
          { name: name, age: age }
        end
      spec_code: |
        raise unless profile("alice", 30) == { name: "alice", age: 30 }
        raise unless profile("bob", 25)   == { name: "bob",   age: 25 }
    - title: Tag counter
      kind: code
      difficulty: 2
      prompt: |
        Given an array of tags, return a hash mapping each tag to
        how many times it appears.
        Hint: use `Hash.new(0)` to avoid nil errors.
      starter_code: |
        def tally(tags)
          # TODO
        end
      solution: |
        def tally(tags)
          tags.each_with_object(Hash.new(0)) { |t, acc| acc[t] += 1 }
        end
      spec_code: |
        raise unless tally(["a", "b", "a"]) == { "a" => 2, "b" => 1 }
        raise unless tally([])              == {}
        raise unless tally(["x", "x", "x"]) == { "x" => 3 }
    - title: Safe lookup
      kind: code
      difficulty: 2
      prompt: |
        Write `value_of(h, key)` that returns `h[key]` if present,
        or the string `"unknown"` if missing. Don't use a special
        hash default — handle it in the method.
      starter_code: |
        def value_of(h, key)
          # TODO
        end
      solution: |
        def value_of(h, key)
          h[key] || "unknown"
        end
      spec_code: |
        raise unless value_of({ a: 1 }, :a)        == 1
        raise unless value_of({ a: 1 }, :b)        == "unknown"
        raise unless value_of({},        :anything) == "unknown"
    - title: Pick keys
      kind: code
      difficulty: 3
      prompt: |
        Write `pick(h, keys)` that returns a new hash containing
        only the given keys (skip missing ones).
      starter_code: |
        def pick(h, keys)
          # TODO
        end
      solution: |
        def pick(h, keys)
          keys.each_with_object({}) do |k, acc|
            acc[k] = h[k] if h.key?(k)
          end
        end
      spec_code: |
        raise unless pick({ a: 1, b: 2, c: 3 }, [:a, :c]) == { a: 1, c: 3 }
        raise unless pick({ a: 1 }, [:a, :missing])       == { a: 1 }
        raise unless pick({}, [:any])                      == {}
  - slug: ranges
    title: Ranges
    body: |
      ## Ranges

      A **range** is a value representing a contiguous sequence — `1` to
      `10`, or `"a"` to `"z"`. Ranges are written with two dots (`..`) for
      inclusive or three dots (`...`) for "up to but not including".

      ### Literal syntax

      ```ruby
      (1..10)     # 1, 2, ..., 9, 10        — inclusive
      (1...10)    # 1, 2, ..., 9             — exclusive (10 is left out)
      ("a".."e")  # "a", "b", "c", "d", "e"
      ```

      ### Membership

      ```ruby
      (1..10).include?(5)      # => true
      (1..10).include?(11)     # => false
      ("a".."e").include?("c") # => true
      ```

      ### Iteration

      Ranges respond to `each`, just like arrays:

      ```ruby
      (1..3).each { |n| puts n }
      # 1
      # 2
      # 3
      ```

      Convert to an array with `.to_a`:

      ```ruby
      (1..5).to_a         # => [1, 2, 3, 4, 5]
      ('a'..'c').to_a     # => ["a", "b", "c"]
      ```

      ### Common uses

      Ranges show up everywhere — `for` loops, array slicing, `between?`,
      `case`-`when` matching:

      ```ruby
      letters = ('a'..'z').to_a   # whole alphabet
      arr = [10, 20, 30, 40, 50]
      arr[1..3]                   # => [20, 30, 40]   (slice by range)
      ```

      ### Pitfall: `...` is easy to miss

      The difference between `..` and `...` is one character. Read carefully
      when debugging off-by-one errors:

      ```ruby
      (1..5).size    # => 5
      (1...5).size   # => 4
      ```
    activities:
    - title: Sum a range
      kind: code
      difficulty: 1
      prompt: Write `sum_to(n)` that returns the sum of integers from 1 to n inclusive.
      starter_code: |
        def sum_to(n)
          # TODO
        end
      solution: |
        def sum_to(n)
          (1..n).sum
        end
      spec_code: |
        raise unless sum_to(5)  == 15
        raise unless sum_to(10) == 55
        raise unless sum_to(1)  == 1
    - title: Count evens
      kind: code
      difficulty: 2
      prompt: Write `even_count(a, b)` that returns how many integers in the inclusive
        range `a..b` are even.
      starter_code: |
        def even_count(a, b)
          # TODO
        end
      solution: |
        def even_count(a, b)
          (a..b).count(&:even?)
        end
      spec_code: |
        raise unless even_count(1, 10) == 5
        raise unless even_count(2, 8)  == 4
        raise unless even_count(1, 1)  == 0
        raise unless even_count(0, 0)  == 1
    - title: Inclusive vs exclusive
      kind: choice
      difficulty: 1
      prompt: What does `(1...5).to_a` return?
      choices:
        a: "[1, 2, 3, 4, 5]"
        b: "[1, 2, 3, 4]"
        c: "[2, 3, 4, 5]"
        d: "[]"
      correct_choice: b
- slug: control-flow
  name: Control flow
  overview: |
    Decisions and loops. Ruby's conditional expressions return values,
    so you can use them inside assignments and method bodies without
    temporary variables.
  lessons:
  - slug: if-and-unless
    title: if and unless
    body: |
      ## if and unless

      ### if

      `if` runs the body when the condition is truthy:

      ```ruby
      if score >= 60
        puts "you passed"
      else
        puts "study more"
      end
      ```

      You can have multiple branches with `elsif`:

      ```ruby
      if score >= 90
        grade = "A"
      elsif score >= 80
        grade = "B"
      elsif score >= 70
        grade = "C"
      else
        grade = "F"
      end
      ```

      ### if as an expression

      A surprise for newcomers: `if` *returns* a value. The whole
      block is an expression, so you can assign its result:

      ```ruby
      grade = if score >= 90 then "A"
              elsif score >= 80 then "B"
              else "F"
              end
      ```

      The value of the chosen branch becomes the value of the whole
      `if`. There's no need for a temporary variable.

      ### Inline (modifier) if

      For a single-line body, you can put `if` at the end:

      ```ruby
      puts "you passed" if score >= 60
      ```

      This reads as "do X, if condition". Great for guard clauses
      and short side effects.

      ### unless: negative if

      `unless` runs the body when the condition is **falsy** —
      basically a `if !`:

      ```ruby
      unless logged_in
        redirect_to_login
      end

      # same as:
      if !logged_in
        redirect_to_login
      end
      ```

      And the inline form:

      ```ruby
      return :guest unless current_user
      ```

      A rule of thumb: use `unless` for single negative conditions
      (`unless user`). Avoid `unless` with `else` (it makes the
      reader invert the meaning twice).

      ### Ternary

      For very short conditional values, Ruby has the same `? :`
      syntax as C:

      ```ruby
      result = score >= 60 ? "pass" : "fail"
      ```

      Don't nest these — for anything beyond one level use a full
      `if`.
    activities:
    - title: Categorize a score
      kind: code
      difficulty: 1
      prompt: 'Return `"pass"` for scores ≥ 60, `"fail"` otherwise.

'
      starter_code: |
        def grade(score)
          # TODO
        end
      solution: |
        def grade(score)
          score >= 60 ? "pass" : "fail"
        end
      spec_code: |
        raise unless grade(80) == "pass"
        raise unless grade(60) == "pass"
        raise unless grade(59) == "fail"
    - title: Letter grade
      kind: code
      difficulty: 2
      prompt: |
        Return `"A"` for ≥ 90, `"B"` for ≥ 80, `"C"` for ≥ 70,
        `"F"` otherwise.
      starter_code: |
        def letter_grade(score)
          # TODO
        end
      solution: |
        def letter_grade(score)
          return "A" if score >= 90
          return "B" if score >= 80
          return "C" if score >= 70
          "F"
        end
      spec_code: |
        raise unless letter_grade(95) == "A"
        raise unless letter_grade(85) == "B"
        raise unless letter_grade(75) == "C"
        raise unless letter_grade(65) == "F"
        raise unless letter_grade(0)  == "F"
    - title: Guard clause
      kind: code
      difficulty: 2
      prompt: |
        Write `discount(price, member)` that returns `price * 0.9`
        if `member` is truthy, otherwise returns `price`
        unchanged. Use the inline modifier form.
      starter_code: |
        def discount(price, member)
          # TODO
        end
      solution: |
        def discount(price, member)
          return price * 0.9 if member
          price
        end
      spec_code: |
        raise unless discount(100, true)  == 90.0
        raise unless discount(100, false) == 100
        raise unless discount(50, nil)    == 50
    - title: unless idiom
      kind: choice
      difficulty: 2
      prompt: |
        Which is the most idiomatic Ruby way to write "redirect if
        the user is not signed in"?
      choices:
        a: redirect_to_login if !current_user
        b: redirect_to_login unless current_user
        c: unless current_user then redirect_to_login else nil end
        d: 'current_user ? nil : redirect_to_login'
      correct_choice: b
  - slug: case-when
    title: case / when
    body: |
      ## case / when

      When you have several conditions to check against the same value,
      `case`/`when` reads much cleaner than a chain of `if`/`elsif`:

      ### Basic form

      ```ruby
      case status
      when :pending  then "still going"
      when :paid     then "money in the bank"
      when :shipped  then "on its way"
      else                "unknown status"
      end
      ```

      Like `if`, `case` is an **expression** — the whole block returns the
      value of the matched branch. You can assign it directly.

      ### How matching works

      `when X` uses `X === value` (the **case equality** operator) to decide
      whether to match. For most types this is the same as `==`, but a few
      classes override it for nice patterns:

      - **Classes** match instances: `when Integer` matches if the value is
        an Integer.
      - **Ranges** match membership: `when 1..10` matches numbers in that
        range.
      - **Regexes** match patterns: `when /\Aerror/` matches strings
        starting with "error".

      ```ruby
      case input
      when Integer       then "got a number"
      when String        then "got text"
      when 1..10         then "small number"  # (only if input is an Integer)
      when /^http/       then "URL"
      else                    "something else"
      end
      ```

      ### Multiple matches per branch

      Separate values with a comma to share a body:

      ```ruby
      case day
      when "Sat", "Sun"  then "weekend"
      when "Mon".."Fri"  then "weekday"
      end
      ```

      ### Pitfall: no fall-through

      Unlike C/Java, Ruby's `case` does **not** fall through between
      branches. The first matching `when` runs, then the case ends. No
      `break` needed.
    activities:
    - title: Day type
      kind: code
      difficulty: 1
      prompt: Write `day_type(day)` that returns `"weekend"` for `"Sat"` or `"Sun"`
        and `"weekday"` for any other string. Use case/when.
      starter_code: |
        def day_type(day)
          # TODO
        end
      solution: |
        def day_type(day)
          case day
          when "Sat", "Sun" then "weekend"
          else                  "weekday"
          end
        end
      spec_code: |
        raise unless day_type("Sat") == "weekend"
        raise unless day_type("Sun") == "weekend"
        raise unless day_type("Mon") == "weekday"
        raise unless day_type("Fri") == "weekday"
    - title: Range match
      kind: code
      difficulty: 2
      prompt: Write `bucket(n)` that returns `"low"` for `0..3`, `"mid"` for `4..7`,
        `"high"` for `8..10`, and `"out of range"` otherwise. Use case/when with ranges.
      starter_code: |
        def bucket(n)
          # TODO
        end
      solution: |
        def bucket(n)
          case n
          when 0..3  then "low"
          when 4..7  then "mid"
          when 8..10 then "high"
          else            "out of range"
          end
        end
      spec_code: |
        raise unless bucket(0)  == "low"
        raise unless bucket(5)  == "mid"
        raise unless bucket(10) == "high"
        raise unless bucket(11) == "out of range"
        raise unless bucket(-1) == "out of range"
    - title: Case equality
      kind: choice
      difficulty: 2
      prompt: Which operator does `when X` actually use to test the case value against
        `X`?
      choices:
        a: "=="
        b: "==="
        c: eql?
        d: equal?
      correct_choice: b
- slug: methods
  name: Methods
  overview: |
    Methods are how Ruby groups behavior. The last expression in the
    body is the return value — no need for an explicit `return` except
    in early-exit paths.
  lessons:
  - slug: defining-methods
    title: Defining methods
    body: |
      ## Defining methods

      A method is a named block of code you can call repeatedly. You
      define one with `def` and end it with `end`:

      ```ruby
      def square(n)
        n * n
      end

      square(4)     # => 16
      ```

      ### Return values

      The value of the **last expression** in the body is the return
      value — no `return` keyword required.

      ```ruby
      def double(n)
        n * 2          # this is what gets returned
      end
      ```

      You *can* use `return` when you want to exit early:

      ```ruby
      def safe_divide(a, b)
        return nil if b == 0
        a / b
      end
      ```

      ### Default arguments

      You can give arguments a default value:

      ```ruby
      def greet(name, greeting = "hi")
        "#{greeting}, #{name}"
      end

      greet("alice")           # => "hi, alice"
      greet("bob", "hello")    # => "hello, bob"
      ```

      Defaults must come *after* required arguments in the
      signature.

      ### Keyword arguments

      For methods with several arguments, positional order gets
      confusing. Keyword arguments let callers say what each value
      is for:

      ```ruby
      def shift(point, by: 1, axis: :x)
        "#{point} shifted by #{by} on #{axis}"
      end

      shift("p", by: 3, axis: :y)
      shift("p")                  # uses defaults
      ```

      You can also make keyword args *required* by leaving off the
      default:

      ```ruby
      def shift(point, by:)
        point + by
      end

      shift("p", by: 3)
      shift("p")    # ArgumentError: missing keyword: by
      ```

      Keyword args are the easiest way to make method calls
      self-documenting at the call site.

      ### Splat arguments

      When you don't know how many arguments will be passed, prefix
      with `*`:

      ```ruby
      def sum(*nums)
        nums.reduce(0, :+)
      end

      sum                # => 0
      sum(1, 2, 3, 4)    # => 10
      ```

      Inside the method, `nums` is an array.

      ### Naming convention

      - Methods that return a boolean usually end in `?`:
        `empty?`, `include?`, `admin?`.
      - Methods that mutate their receiver (or raise) often end in
        `!`: `upcase!`, `save!`.
      - Use `snake_case` for method names — never `camelCase`.
    activities:
    - title: Implement abs_diff
      kind: code
      difficulty: 1
      prompt: |
        Define `abs_diff(a, b)` returning the absolute difference
        of two numbers.
      starter_code: |
        def abs_diff(a, b)
          # TODO
        end
      solution: |
        def abs_diff(a, b)
          (a - b).abs
        end
      spec_code: |
        raise unless abs_diff(5, 3)  == 2
        raise unless abs_diff(3, 5)  == 2
        raise unless abs_diff(-1, 1) == 2
    - title: Greet with default
      kind: code
      difficulty: 1
      prompt: |
        Write `greet(name, greeting = "hi")` that returns
        `"GREETING, NAME"`.
      starter_code: |
        def greet(name, greeting = "hi")
          # TODO
        end
      solution: |
        def greet(name, greeting = "hi")
          "#{greeting}, #{name}"
        end
      spec_code: |
        raise unless greet("alice")         == "hi, alice"
        raise unless greet("bob", "hello")  == "hello, bob"
    - title: Safe divide
      kind: code
      difficulty: 2
      prompt: |
        Write `safe_divide(a, b)` that returns `a / b`, or `nil`
        if `b` is zero. Use an early `return`.
      starter_code: |
        def safe_divide(a, b)
          # TODO
        end
      solution: |
        def safe_divide(a, b)
          return nil if b == 0
          a / b
        end
      spec_code: |
        raise unless safe_divide(10, 2) == 5
        raise unless safe_divide(7, 0).nil?
        raise unless safe_divide(0, 5) == 0
    - title: Keyword args
      kind: code
      difficulty: 2
      prompt: |
        Write `shift(point, by: 1)` that returns `point + by`.
        `by` should be a keyword argument with a default of `1`.
      starter_code: |
        def shift(point, by: 1)
          # TODO
        end
      solution: |
        def shift(point, by: 1)
          point + by
        end
      spec_code: |
        raise unless shift(10)         == 11
        raise unless shift(10, by: 5)  == 15
        raise unless shift(10, by: -3) == 7
    - title: Variadic sum
      kind: code
      difficulty: 3
      prompt: |
        Write `sum_all(*nums)` that accepts any number of integer
        arguments and returns their sum. With no arguments it
        should return `0`.
      starter_code: |
        def sum_all(*nums)
          # TODO
        end
      solution: |
        def sum_all(*nums)
          nums.reduce(0, :+)
        end
      spec_code: |
        raise unless sum_all          == 0
        raise unless sum_all(5)       == 5
        raise unless sum_all(1, 2, 3) == 6
        raise unless sum_all(*[1, 2, 3, 4]) == 10
