- slug: modules-and-mixins
  name: Modules and mixins
  overview: |
    Modules have two distinct roles: namespacing related code, and
    mixing shared behavior into classes. The next few lessons walk
    through both.
  lessons:
  - slug: namespaces-with-modules
    title: Namespaces with modules
    body: |
      ## Namespaces with modules

      A Ruby **module** has two distinct uses: grouping related things
      under a namespace, or mixing behavior into classes. This lesson
      covers the first.

      ### What's a namespace?

      When two libraries define a class called `Logger`, you have a name
      collision — whichever is loaded last wins, silently overwriting the
      other. Wrapping each in a module gives them distinct, qualified
      names:

      ```ruby
      module Payments
        class Logger
          def log(msg); "[payments] #{msg}"; end
        end
      end

      module Shipping
        class Logger
          def log(msg); "[shipping] #{msg}"; end
        end
      end

      Payments::Logger.new.log("ok")    # "[payments] ok"
      Shipping::Logger.new.log("ok")    # "[shipping] ok"
      ```

      `Payments::Logger` reads "the Logger inside the Payments
      namespace." `::` is how you walk into a namespace.

      ### Nesting

      Modules can nest as deep as you need:

      ```ruby
      module Acme
        module Billing
          class Invoice; end
        end
      end

      Acme::Billing::Invoice.new
      ```

      ### Why use them?

      - **Avoid collisions.** Two libraries can both define `User` without
        fighting.
      - **Group related code.** Everything billing-related lives under
        `Acme::Billing`.
      - **Convey intent.** Reading `Payments::Logger.new` tells the reader
        immediately what kind of logger this is.

      ### Constants live in modules too

      Constants — including class names — defined inside a module are
      scoped to that module:

      ```ruby
      module Auth
        DEFAULT_REALM = "users"
      end

      Auth::DEFAULT_REALM    # => "users"
      DEFAULT_REALM          # NameError
      ```

      ### Modules are objects

      In Ruby, a module is a regular object (an instance of `Module`).
      That means you can pass it around, ask its name, and so on:

      ```ruby
      Payments.name          # => "Payments"
      ```
    activities:
    - title: Build a namespace
      kind: code
      difficulty: 2
      prompt: Define `Payments::Logger` so `Payments::Logger.new.log("hi")` returns
        `"[payments] hi"`.
      starter_code: |
        module Payments
          # TODO: Logger class here
        end
      solution: |
        module Payments
          class Logger
            def log(msg)
              "[payments] #{msg}"
            end
          end
        end
      spec_code: |
        raise unless Payments::Logger.new.log("hi") == "[payments] hi"
        raise unless Payments::Logger.new.log("x")  == "[payments] x"
    - title: Why namespace?
      kind: choice
      difficulty: 1
      prompt: Two libraries each define a class `Client`. What's the cleanest fix?
      choices:
        a: Rename one of them in source
        b: Wrap each library's class in its own module — Stripe::Client and Github::Client
        c: Define both as private
        d: Convert one to a Proc
      correct_choice: b
    - title: Reach into a namespace
      kind: code
      difficulty: 2
      prompt: Define `Acme::Billing::Invoice` with `attr_reader :total` set in initialize.
        Then create one with total 99 and access it via the fully qualified name.
      starter_code: "# build Acme::Billing::Invoice here\n"
      solution: |
        module Acme
          module Billing
            class Invoice
              attr_reader :total
              def initialize(total); @total = total; end
            end
          end
        end
      spec_code: |
        i = Acme::Billing::Invoice.new(99)
        raise unless i.total == 99
        raise unless i.is_a?(Acme::Billing::Invoice)
  - slug: mixin-with-include
    title: Mixin with include
    body: |
      ## Mixin with `include`

      A module can carry methods for *other* classes to use. When a class
      `include`s a module, the module's methods become **instance
      methods** on that class.

      ### Basic example

      ```ruby
      module Greetable
        def greet
          "hi, I'm #{name}"
        end
      end

      class User
        include Greetable
        attr_reader :name
        def initialize(name); @name = name; end
      end

      class Robot
        include Greetable
        attr_reader :name
        def initialize(name); @name = name; end
      end

      User.new("alice").greet     # => "hi, I'm alice"
      Robot.new("R2D2").greet     # => "hi, I'm R2D2"
      ```

      Both `User` and `Robot` get `greet` without any inheritance
      relationship. The module describes a **role** (anything that can
      greet) rather than a specific class.

      ### Why use it?

      - Share behavior across **unrelated** classes — no need to invent a
        common parent just to share code.
      - Keep classes small. A class with five mixins is often clearer than
        one with fifty methods.
      - **No diamond problem.** Ruby resolves the order
        deterministically through the ancestor chain.

      ### Where modules sit in the ancestor chain

      ```ruby
      User.ancestors
      # => [User, Greetable, Object, Kernel, BasicObject]
      ```

      Notice `Greetable` is between `User` and `Object`. When you call
      `greet`, Ruby walks this chain top to bottom and stops at the first
      match.

      ### Modules can rely on host methods

      In the example, `Greetable` calls `name` — a method `User` and
      `Robot` provide. The module describes a **contract**: "I'll give you
      `greet` if you give me `name`." This is duck typing again.

      ### `include` vs `extend`

      - `include` adds the module's methods as **instance** methods.
      - `extend` adds them as **class** (singleton) methods.

      Next lesson covers `extend`.
    activities:
    - title: Share with include
      kind: code
      difficulty: 2
      prompt: Define a module `Loud` whose `shout` method returns `to_s.upcase + "!"`.
        Then `String` already has `to_s`. Define a class `Word` with an initializer
        that stores a `@text`, a `to_s` method returning it, and `include` Loud so
        `Word.new("hi").shout` returns `"HI!"`.
      starter_code: |
        module Loud
          # TODO
        end

        class Word
          def initialize(text); @text = text; end
          def to_s; @text; end
          # include the module
        end
      solution: |
        module Loud
          def shout
            to_s.upcase + "!"
          end
        end

        class Word
          include Loud
          def initialize(text); @text = text; end
          def to_s; @text; end
        end
      spec_code: |
        raise unless Word.new("hi").shout == "HI!"
        raise unless Word.new("bye").shout == "BYE!"
    - title: include adds what?
      kind: choice
      difficulty: 1
      prompt: When `Class C; include M; end`, the methods defined in `M` become…
      choices:
        a: class (singleton) methods of C
        b: instance methods of C
        c: global methods
        d: private methods of C
      correct_choice: b
    - title: Shared role across classes
      kind: code
      difficulty: 2
      prompt: 'Define a module `Identifiable` with method `id_card` returning `"ID:
        " + name`. Then create two unrelated classes `Employee` and `Visitor`, each
        with an `attr_reader :name` set in initialize, and both `include Identifiable`.
        Both should respond to `id_card`.'
      starter_code: |
        module Identifiable
          # TODO
        end

        class Employee
          # TODO
        end

        class Visitor
          # TODO
        end
      solution: |
        module Identifiable
          def id_card
            "ID: " + name
          end
        end

        class Employee
          include Identifiable
          attr_reader :name
          def initialize(name); @name = name; end
        end

        class Visitor
          include Identifiable
          attr_reader :name
          def initialize(name); @name = name; end
        end
      spec_code: |
        raise unless Employee.new("alice").id_card == "ID: alice"
        raise unless Visitor.new("bob").id_card   == "ID: bob"
        raise unless Employee.ancestors.include?(Identifiable)
        raise unless Visitor.ancestors.include?(Identifiable)
  - slug: mixin-with-extend
    title: Mixin with extend
    body: |
      ## Mixin with `extend`

      `include` adds module methods as **instance** methods of the host
      class. `extend` adds them as **class** (singleton) methods.

      ### Side-by-side comparison

      ```ruby
      module Counter
        def count; @count ||= 0; end
        def bump; @count = count + 1; end
      end

      class WithInclude
        include Counter    # available on instances
      end

      class WithExtend
        extend Counter     # available on the class itself
      end

      WithInclude.new.bump   # works: instance method
      WithExtend.bump        # works: class method
      WithInclude.bump       # NoMethodError
      WithExtend.new.bump    # NoMethodError
      ```

      ### When to use each

      - **`include`** — the module describes a *role* of instances:
        "anything that can be Greetable, Comparable, Enumerable…". This is
        the common case.
      - **`extend`** — the module describes class-level helpers: factory
        methods, registries, configuration DSL.

      ### `extend` on a single object

      You can also `extend` an individual object — adding methods to *that
      instance only*:

      ```ruby
      module Yelling
        def speak; "HEY!"; end
      end

      obj = Object.new
      obj.extend(Yelling)
      obj.speak              # => "HEY!"

      Object.new.speak       # NoMethodError — another instance is untouched
      ```

      This is rarely needed but handy for test doubles and one-off
      patches.

      ### `include` + `extend` together (the Concern pattern)

      A common pattern is to use both: `include` adds instance methods,
      while a nested `ClassMethods` submodule is `extend`ed to add class
      methods:

      ```ruby
      module Trackable
        def self.included(base)
          base.extend(ClassMethods)
        end

        def track!; @tracked = true; end          # instance method

        module ClassMethods
          def tracked_count; @tracked_count ||= 0; end
        end
      end
      ```

      `ActiveSupport::Concern` automates the boilerplate, but this is what
      it's doing under the hood.
    activities:
    - title: extend at class level
      kind: code
      difficulty: 2
      prompt: Define a module `Singleton` with method `instance` returning `@instance
        ||= new`. Then `extend` it into a class `Logger` so `Logger.instance` returns
        a single shared instance.
      starter_code: |
        module Singleton
          # TODO
        end

        class Logger
          # extend the module here
        end
      solution: |
        module Singleton
          def instance
            @instance ||= new
          end
        end

        class Logger
          extend Singleton
        end
      spec_code: |
        raise unless Logger.instance.equal?(Logger.instance)   # same object each call
        raise unless Logger.instance.is_a?(Logger)
    - title: include vs extend
      kind: choice
      difficulty: 2
      prompt: You want a module's methods to be callable as `MyClass.foo`, not as
        `MyClass.new.foo`. Which mixin?
      choices:
        a: include
        b: extend
        c: prepend
        d: using
      correct_choice: b
    - title: Patch one object
      kind: code
      difficulty: 3
      prompt: Define a module `Polite` with method `greet` returning `"hello, friend"`.
        Create an `obj = Object.new`, `extend` Polite into just *that* object, and
        verify only it responds to `greet`.
      starter_code: |
        module Polite
          # TODO
        end

        obj = Object.new
        # extend Polite into obj only
      solution: |
        module Polite
          def greet; "hello, friend"; end
        end

        obj = Object.new
        obj.extend(Polite)
      spec_code: |
        raise unless obj.greet == "hello, friend"
        begin
          Object.new.greet
          raise "other instances should NOT respond"
        rescue NoMethodError
          :ok
        end
  - slug: comparable-module
    title: The Comparable module
    body: |
      ## The Comparable module

      When you have a class whose instances have a natural ordering — by
      price, by length, by score — Ruby's standard library gives you a way
      to plug into all the comparison methods at once: include
      `Comparable` and define `<=>`.

      ### The deal

      You implement **one** method:

      ```ruby
      def <=>(other)
        # return -1, 0, or 1
      end
      ```

      In return, `Comparable` gives your class **all** of these:

      - `<`, `<=`, `>`, `>=`
      - `==`
      - `between?(a, b)`
      - `clamp(a, b)`

      Plus your objects become sortable with `.sort`.

      ### Concrete example

      ```ruby
      class Score
        include Comparable
        attr_reader :value
        def initialize(value); @value = value; end

        def <=>(other)
          value <=> other.value
        end
      end

      a = Score.new(80)
      b = Score.new(95)

      a < b              # => true
      a.between?(Score.new(50), Score.new(100))   # => true
      [b, a].sort        # => [a, b]   (sorted ascending)
      ```

      All eight comparison methods came from one `<=>` definition.

      ### `<=>` should return -1, 0, 1 — or nil

      Return `nil` from `<=>` when the comparison is meaningless (apples
      and oranges literally). Methods like `<` then return `nil`, and
      callers get a clear signal that the values aren't comparable.

      ### Why it matters for design

      Including `Comparable` is a way to **buy a lot of behavior cheaply**.
      Instead of writing seven comparison methods (and forgetting one),
      you write one and get them all consistently. That's the
      payoff of including well-designed standard-library modules.

      ### Pitfall: equality and hashing

      If you redefine equality (`==` or `<=>`), think about whether `eql?`
      and `hash` should also be redefined. Two objects that are `==` should
      ideally also have the same `hash`, or hash-based collections (`Set`,
      `Hash` keys) misbehave.
    activities:
    - title: Make Score comparable
      kind: code
      difficulty: 2
      prompt: Define `Score` with `attr_reader :value` set in initialize. `include
        Comparable` and define `<=>` so two Score instances compare by `value`. Verify
        `<`, `==`, and `sort` all work.
      starter_code: |
        class Score
          # TODO
        end
      solution: |
        class Score
          include Comparable
          attr_reader :value
          def initialize(value); @value = value; end
          def <=>(other); value <=> other.value; end
        end
      spec_code: |
        a = Score.new(80)
        b = Score.new(95)
        c = Score.new(80)
        raise unless a < b
        raise unless b > a
        raise unless a == c
        raise unless [b, a, c].sort.map(&:value) == [80, 80, 95]
