          def greet; "hi"; end
        end

        # write LoudGreeter
      solution: |
        class Greeter
          def greet; "hi"; end
        end

        class LoudGreeter < Greeter
          def greet
            super.upcase + "!"
          end
        end
      spec_code: |
        raise unless LoudGreeter.new.greet == "HI!"
        raise unless Greeter.new.greet     == "hi"
    - title: Bare super behavior
      kind: choice
      difficulty: 2
      prompt: Inside a method `def initialize(name)`, what does bare `super` (no parens)
        do?
      choices:
        a: Calls parent initialize with no arguments
        b: Calls parent initialize with the same `name` argument
        c: Calls parent initialize with nil
        d: Raises ArgumentError
      correct_choice: b
    - title: Extend initialize
      kind: code
      difficulty: 3
      prompt: Given `Animal` with `attr_reader :name` set in `initialize(name)`, write
        `Dog < Animal` whose `initialize(name, breed)` calls `super(name)` to set
        the parent's state and then stores `@breed`. `Dog` should expose `breed` via
        `attr_reader`.
      starter_code: |
        class Animal
          attr_reader :name
          def initialize(name); @name = name; end
        end

        # write Dog
      solution: |
