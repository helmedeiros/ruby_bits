---
slug: expressions
name: Expressions
description: Sweet ruby syntax for common conditional patterns.
position: 1
modules:
- slug: conditionals
  name: Conditional Expressions
  overview: |
    In ruby, `if`/`unless` are expressions — they return values.
    You can use them inline, chain them, and skip `nil` checks
    with the right idioms.
  lessons:
  - slug: inline-if
    title: Inline if
    body: |
      ## Inline if

      Instead of:

      ```ruby
      if user.admin?
        grant_access(user)
      end
      ```

      You can write it inline:

      ```ruby
      grant_access(user) if user.admin?
      ```

      ### When to use it
      - One-line side effects gated by a predicate
      - Guard clauses at the top of a method

      ### When to avoid it
      - Multi-line bodies
      - Compound conditions you'd rather extract into a method
    activities:
    - title: Make it inline
      kind: code
      prompt: |
        Rewrite `notify` so it sends the message **only** when the
        user has a phone. Use the inline `if` form.
      starter_code: |
        def notify(user, message)
          if user.phone
            Sms.send(user.phone, message)
          end
        end
      solution: |
        def notify(user, message)
          Sms.send(user.phone, message) if user.phone
        end
      spec_code: |
        class Sms; def self.send(*); :sent; end; end
        class U;   def phone; '+5511'; end; end
        raise 'failed' unless notify(U.new, 'hi') == :sent
        class N;   def phone; nil; end; end
        raise 'should not send' if notify(N.new, 'hi')
    - title: Spot the smell
      kind: choice
      prompt: Which line is most likely a code smell?
      choices:
        a: return if params[:id].nil?
        b: delete_user if user.banned? && audit_passed?
        c: raise unless authorized?
        d: schedule_payment(invoice) if invoice.due?
      correct_choice: b
  - slug: unless
    title: unless — the negated if
    body: |
      ## unless

      `unless` reads cleaner than `if !condition` for negative checks.

      ```ruby
      # verbose
      raise 'must be signed in' if !current_user

      # idiomatic
      raise 'must be signed in' unless current_user
      ```

      ### Rules of thumb
      - Use it for single-clause negatives.
      - Avoid pairing it with `else` — the reader has to invert twice.
      - Avoid mixing it with `&&` — extract the negative condition into a predicate.
    activities:
    - title: Rewrite to unless
      kind: code
      prompt: |
        Rewrite `audit` so it logs **only when** the action is not
        whitelisted, using `unless`.
      starter_code: |
        WHITELIST = %i[ping read]

        def audit(action)
          if !WHITELIST.include?(action)
            Log.warn(action)
          end
        end
      solution: |
        WHITELIST = %i[ping read]

        def audit(action)
          Log.warn(action) unless WHITELIST.include?(action)
        end
      spec_code: |
        class Log
          @@last = nil
          def self.warn(x); @@last = x; end
          def self.last; @@last; end
        end
        audit(:ping)
        raise 'should not warn on ping' if Log.last
        audit(:delete)
        raise 'should warn on delete' unless Log.last == :delete
    - title: When is unless wrong?
      kind: choice
      prompt: 'Which use of `unless` is least idiomatic?

'
      choices:
        a: unless current_user — single negative
        b: unless valid? && persisted? — compound condition
        c: puts msg unless quiet — short side effect
        d: return unless params[:id] — guard clause
      correct_choice: b
  - slug: conditional-assignment
    title: Conditional assignment
    body: |
      ## Conditional assignment

      `||=` assigns only if the variable is `nil` or `false`. It is the
      canonical memoisation idiom in ruby.

      ```ruby
      def projects
        @projects ||= Project.where(owner: self).to_a
      end
      ```

      Be careful: `||=` rejects any falsy value, not just `nil`. If
      `false` is a legitimate value, use `defined?` instead.
    activities:
    - title: Memoise with ||=
      kind: code
      prompt: 'Make `expensive` compute its result only once per instance.

'
      starter_code: |
        class Cache
          def expensive
            @result = 2 ** 20
          end
        end
      solution: |
        class Cache
          def expensive
            @result ||= 2 ** 20
          end
        end
      spec_code: |
        c = Cache.new
        first = c.expensive
        c.instance_variable_set(:@check, 1)
        second = c.expensive
        raise 'not memoised' unless c.instance_variable_get(:@result) == first
