---
slug: methods
name: Methods
description: Argument forms beyond positional — defaults, splats, options.
position: 3
modules:
- slug: arguments
  name: Method arguments
  overview: |
    Ruby gives you several knobs for method signatures:
    defaults, splats, options hashes, and (since 2.0) keyword args.
  lessons:
  - slug: default-arguments
    title: Default arguments
    body: |
      ## Default arguments

      ```ruby
      def greet(name, greeting = 'hi')
        "#{greeting}, #{name}"
      end
      ```

      Defaults must come **after** required arguments. They may
      reference earlier args:

      ```ruby
      def fade(value, by = value / 2)
        value - by
      end
      ```
    activities:
    - title: Add a default
      kind: code
      prompt: Add a default of `' '` to `joiner` in `join_with`.
      starter_code: |
        def join_with(items, joiner)
          items.join(joiner)
        end
      solution: |
        def join_with(items, joiner = ' ')
          items.join(joiner)
        end
      spec_code: |
        raise unless join_with(%w[a b c]) == 'a b c'
        raise unless join_with(%w[a b c], '-') == 'a-b-c'
  - slug: splat-arguments
    title: Splat arguments
    body: |
      ## Splats

      Prefix an arg with `*` to collect remaining positional args
      into an Array:

      ```ruby
      def log(level, *messages)
        messages.each { |m| puts "[#{level}] #{m}" }
      end
      ```

      Use `**` for keyword-args (ruby 2.0+).
    activities:
    - title: Collect with splat
      kind: code
      prompt: Make `total` accept any number of numbers.
      starter_code: |
        def total
          # TODO
        end
      solution: |
        def total(*nums)
          nums.inject(0, :+)
        end
      spec_code: |
        raise unless total == 0
        raise unless total(1) == 1
        raise unless total(1,2,3,4) == 10
  - slug: raise-exception
    title: Raising exceptions
    body: |
      ## Raising

      When a method cannot return a sensible value, raise rather than returning a sentinel:

      ```ruby
      def withdraw!(amount)
        raise ArgumentError, "amount must be > 0" unless amount > 0
        @balance -= amount
      end
      ```

      Use the right ancestor class — `ArgumentError`, `KeyError`, `RuntimeError` — so callers can rescue with intent.
    activities:
    - title: Guard with raise
      kind: code
      prompt: Raise `ArgumentError` from `divide` when the divisor is zero.
      starter_code: |
        def divide(a, b)
          a / b
        end
      solution: |
        def divide(a, b)
          raise ArgumentError, "divisor cannot be zero" if b.zero?
          a / b
        end
      spec_code: |
        raise unless divide(10, 2) == 5
        begin; divide(1, 0); rescue ArgumentError; raise unless $!.message =~ /zero/; end
