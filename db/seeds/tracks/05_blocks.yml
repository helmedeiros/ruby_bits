slug: blocks
name: Blocks, Procs & Lambdas
description: The three flavours of callable in ruby and when to use each.
position: 5
modules:
  - slug: blocks-and-yield
    name: Blocks & yield
    overview: |
      A block is the implicit callable attached to a method call.
      You invoke it with `yield`, capture it with `&blk`, and detect it
      with `block_given?`.
    lessons:
      - slug: yield
        title: yield
        body: |
          ## yield

          ```ruby
          def each_pair(hash)
            hash.each { |k, v| yield k, v }
          end

          each_pair(name: 'alice') { |k, v| puts "#{k}=#{v}" }
          ```

          `yield` raises `LocalJumpError` if no block was given. Guard
          with `block_given?` when the block is optional.
        activities:
          - title: Use yield
            kind: code
            prompt: Make `times_with_msg(n)` yield each index 0..n-1.
            starter_code: |
              def times_with_msg(n)
                # TODO
              end
            solution: |
              def times_with_msg(n)
                n.times { |i| yield i }
              end
            spec_code: |
              collected = []
              times_with_msg(3) { |i| collected << i }
              raise unless collected == [0, 1, 2]

      - slug: proc-vs-lambda
        title: Proc vs lambda
        body: |
          ## Procs and lambdas

          `Proc.new` and `lambda` both create callable objects, but they
          differ on **return** and **arity**:

          | Behaviour      | proc                            | lambda                  |
          |---------------|---------------------------------|-------------------------|
          | wrong arity    | tolerates                       | raises `ArgumentError`  |
          | `return` inside| returns from enclosing method   | returns from the lambda |
        activities:
          - title: Lambda arity is strict
            kind: choice
            prompt: |
              `add = lambda { |a, b| a + b }; add.call(1, 2, 3)` raises…
            choices:
              a: NoMethodError
              b: ArgumentError
              c: Returns 3
              d: Returns 6
            correct_choice: b
