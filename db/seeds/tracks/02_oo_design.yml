---
slug: oo-design
name: OO Design
description: Design rules that survive the next change — principles from Sandi Metz's
  POODR, taught with original examples.
position: 2
modules:
- slug: classes-and-objects
  name: Classes and objects
  overview: |
    Before we talk about *design*, you need to know how to *define* a
    class. Three lessons walk through the skeleton, accessors, and the
    difference between instance and class behavior.
  lessons:
  - slug: defining-classes
    title: Defining classes
    body: |
      ## Defining classes

      A **class** in Ruby groups data (instance variables) and behavior
      (methods) under one name. Every class you write follows the same
      shape.

      ### Skeleton

      ```ruby
      class Account
        def initialize(balance)
          @balance = balance
        end

        def deposit(amount)
          @balance += amount
        end

        def balance
          @balance
        end
      end
      ```

      Three things to notice:

      1. **`class Name`** opens a class definition. `Name` must start with
         an uppercase letter — it's a constant.
      2. **`initialize`** is the special method Ruby calls when you write
         `Account.new(...)`. Whatever args you pass to `new` get forwarded
         to `initialize`.
      3. **`@balance`** is an instance variable — each `Account.new`
         creates a fresh `@balance` on that object.

      ### Creating and using instances

      ```ruby
      acc = Account.new(100)   # calls initialize(100)
      acc.deposit(50)
      acc.balance              # => 150
      ```

      `acc.deposit(50)` is Ruby's way of saying "send the `deposit`
      message to `acc` with the argument `50`."

      ### Each instance has its own state

      ```ruby
      a = Account.new(100)
      b = Account.new(0)
      a.deposit(50)
      a.balance    # => 150
      b.balance    # =>   0    (untouched)
      ```

      Two instances of the same class hold independent `@balance` values.
      This is the whole point of OO: bundle data with the behavior that
      operates on it, and let each object hold its own data.

      ### `attr_reader`, `attr_writer`, `attr_accessor`

      Writing `def balance; @balance; end` for every variable is tedious.
      The next lesson covers the shorthand.

      ### Pitfall: typos in `@names`

      A misspelled `@balanace` doesn't raise — it just creates a new
      (always `nil`) instance variable. Watch for typos.
    activities:
    - title: Build a Counter
      kind: code
      difficulty: 1
      prompt: Define `Counter` with an `initialize` that starts at 0, a `tick` method
        that increments, and a `count` method that returns the current value.
      starter_code: |
        class Counter
          # TODO
        end
      solution: |
        class Counter
          def initialize
            @count = 0
          end

          def tick
            @count += 1
          end

          def count
            @count
          end
        end
      spec_code: |
        c = Counter.new
        raise unless c.count == 0
        c.tick; c.tick; c.tick
        raise unless c.count == 3
        d = Counter.new
        raise unless d.count == 0  # independent state
    - title: What does `new` call?
      kind: choice
      difficulty: 1
      prompt: When you write `Account.new(100)`, which method runs in your class?
      choices:
        a: "`new`"
        b: "`create`"
        c: "`initialize`"
        d: "`call`"
      correct_choice: c
    - title: A Wallet that withdraws
      kind: code
      difficulty: 2
      prompt: Define `Wallet` with an initial `@balance`. Implement `withdraw(amount)`
        that subtracts from the balance (any amount, no validation here) and returns
        the new balance.
      starter_code: |
        class Wallet
          # TODO
        end
      solution: |
        class Wallet
          def initialize(balance)
            @balance = balance
          end

          def withdraw(amount)
            @balance -= amount
          end

          def balance
            @balance
          end
        end
      spec_code: |
        w = Wallet.new(100)
        raise unless w.balance == 100
        raise unless w.withdraw(30) == 70
        raise unless w.balance == 70
        raise unless w.withdraw(70) == 0
  - slug: attr-accessor-trio
    title: attr_reader, attr_writer, attr_accessor
    body: |
      ## attr_accessor, attr_reader, attr_writer

      Writing `def balance; @balance; end` (and the matching `=` writer) for
      every instance variable gets tedious fast. Ruby gives you three
      shorthands that generate these methods for you.

      ### `attr_reader` — read-only

      Generates a getter:

      ```ruby
      class Account
        attr_reader :balance

        def initialize(balance)
          @balance = balance
        end
      end

      a = Account.new(100)
      a.balance        # => 100
      a.balance = 50   # NoMethodError — no setter
      ```

      Use this when callers should be able to *see* the value but not
      change it directly. Mutation should happen through deliberate methods
      (`deposit`, `withdraw`), not by overwriting state.

      ### `attr_writer` — write-only

      Generates a setter:

      ```ruby
      class Logger
        attr_writer :level
      end

      l = Logger.new
      l.level = :debug    # works
      l.level             # NoMethodError — no getter
      ```

      Used much less often than `attr_reader`.

      ### `attr_accessor` — both

      Both getter and setter:

      ```ruby
      class User
        attr_accessor :name
      end

      u = User.new
      u.name = "alice"
      u.name              # => "alice"
      ```

      ### Use the strictest one that works

      If callers should only *read*, use `attr_reader`. If they need to
      *write*, use `attr_accessor`. Don't reach for `attr_accessor`
      reflexively — it gives callers permission to change state, which
      spreads responsibility.

      ### Multiple at once

      All three accept several symbols:

      ```ruby
      attr_reader :name, :email, :role
      attr_accessor :active, :verified
      ```

      ### Pitfall: inside the class, prefer the accessor

      Once you have `attr_reader :balance`, code inside the class can call
      `balance` instead of `@balance`. The advantage: if you later change
      how `balance` is computed (e.g. add caching, or compute from other
      fields), you only change the `balance` method — every internal user
      follows along.
    activities:
    - title: Read-only balance
      kind: code
      difficulty: 1
      prompt: Define `Account` with a read-only `balance` (set via initialize) and
        a `deposit(amount)` method that adds to the internal balance. Trying to call
        `account.balance = 0` from outside should raise NoMethodError.
      starter_code: |
        class Account
          # TODO
          def initialize(balance)
            @balance = balance
          end

          def deposit(amount)
            @balance += amount
          end
        end
      solution: |
        class Account
          attr_reader :balance

          def initialize(balance)
            @balance = balance
          end

          def deposit(amount)
            @balance += amount
          end
        end
      spec_code: |
        a = Account.new(100)
        raise unless a.balance == 100
        a.deposit(50)
        raise unless a.balance == 150
        begin
          a.balance = 0
          raise "setter should not exist"
        rescue NoMethodError
          :ok
        end
    - title: Pick the strictest
      kind: choice
      difficulty: 2
      prompt: You need callers to *read* a value but never overwrite it directly.
        Which is the right choice?
      choices:
        a: attr_writer
        b: attr_reader
        c: attr_accessor
        d: No accessor — keep it as a bare @ivar
      correct_choice: b
    - title: Editable User
      kind: code
      difficulty: 2
      prompt: Define `User` with `attr_accessor` for both `name` and `email`. Initialize
        them via keyword args.
      starter_code: |
        class User
          # TODO
        end
      solution: |
        class User
          attr_accessor :name, :email

          def initialize(name:, email:)
            @name, @email = name, email
          end
        end
      spec_code: |
        u = User.new(name: "alice", email: "a@x")
        raise unless u.name == "alice"
        raise unless u.email == "a@x"
        u.name = "bob"
        u.email = "b@y"
        raise unless u.name == "bob"
        raise unless u.email == "b@y"
  - slug: instance-vs-class-methods
    title: Instance vs class methods
    body: |
      ## Instance methods vs class methods

      ### Two kinds of methods

      A class can define two kinds of method:

      - **Instance methods** — called on an *instance* of the class.
      - **Class methods** — called on the *class itself*.

      ```ruby
      class Account
        def deposit(amount)   # instance method
          @balance += amount
        end

        def self.zero         # class method — note the `self.`
          Account.new(0)
        end
      end

      a = Account.zero        # class method on the class
      a.deposit(50)           # instance method on the instance
      ```

      ### Why two kinds?

      - **Instance methods** operate on the state of *one specific
        object*. They use `@balance`, `@email`, etc.
      - **Class methods** don't depend on a specific instance. They build
        new objects, look up things by attribute, or expose data about the
        class as a whole.

      Common class-method patterns:

      ```ruby
      Order.find(42)              # look up by id — returns an Order
      Order.pending               # all pending orders
      Order.from_csv(line)        # factory: build from raw data
      ```

      ### Syntax choices

      Three ways to write class methods — pick one and be consistent:

      ```ruby
      class Foo
        def self.greet; "hi"; end          # most common
      end

      class Foo
        def Foo.greet; "hi"; end           # rare — repeats the class name
      end

      class Foo
        class << self
          def greet; "hi"; end             # for many class methods at once
        end
      end
      ```

      ### Pitfall: `self` inside a class method

      Inside a class method, `self` IS the class — so `self.new` builds an
      instance:

      ```ruby
      class Account
        def self.zero
          self.new(0)   # or just `new(0)`
        end
      end
      ```

      This is what makes class methods inheritable: subclasses get the
      same factory behavior automatically.
    activities:
    - title: Factory method
      kind: code
      difficulty: 2
      prompt: Define `Counter` with `attr_reader :count` and a class method `Counter.starting_at(n)`
        that returns a new Counter whose `count` is `n`.
      starter_code: |
        class Counter
          attr_reader :count

          def initialize(count = 0)
            @count = count
          end

          # TODO: define the class method
        end
      solution: |
        class Counter
          attr_reader :count

          def initialize(count = 0)
            @count = count
          end

          def self.starting_at(n)
            new(n)
          end
        end
      spec_code: |
        c = Counter.starting_at(7)
        raise unless c.count == 7
        raise unless c.is_a?(Counter)
        d = Counter.starting_at(0)
        raise unless d.count == 0
    - title: Class method or instance method?
      kind: choice
      difficulty: 1
      prompt: Which call goes on the *class*, not an *instance*?
      choices:
        a: order.confirm!
        b: order.total
        c: Order.find(42)
        d: order.shipped?
      correct_choice: c
    - title: Per-instance state
      kind: code
      difficulty: 2
      prompt: Define `Wallet` with a class method `Wallet.empty` (returns a Wallet
        with balance 0) and an instance method `deposit(amount)` adding to `@balance`.
        Two wallets must not share state.
      starter_code: |
        class Wallet
          attr_reader :balance
          # TODO
        end
      solution: |
        class Wallet
          attr_reader :balance

          def initialize(balance = 0)
            @balance = balance
          end

          def self.empty
            new(0)
          end

          def deposit(amount)
            @balance += amount
          end
        end
      spec_code: |
        a = Wallet.empty
        b = Wallet.empty
        a.deposit(100)
        raise unless a.balance == 100
        raise unless b.balance == 0   # independent
  - slug: private-methods
    title: Private methods
    body: |
      ## Private methods

      By default, every method you define in a Ruby class is **public** —
      any code with a reference to the object can call it. That's a lot of
      surface. The `private` keyword shrinks the public interface to just
      what you want callers to use.

      ### Marking methods private

      Place `private` on its own line; everything defined after it (until
      another visibility keyword) is private:

      ```ruby
      class Order
        def confirm!
          return false unless valid?
          mark_confirmed
          true
        end

        private

        def valid?
          !total.zero? && customer
        end

        def mark_confirmed
          @confirmed_at = Time.now
        end
      end
      ```

      Now `order.confirm!` works from outside, but
      `order.mark_confirmed` raises `NoMethodError`. Internal helpers stay
      internal.

      ### Why bother?

      - **Smaller public surface** = fewer ways callers can misuse the
        object.
      - **Freedom to refactor**: you can rename or delete a private method
        confidently — no external code can depend on it.
      - **Clearer reading**: the public methods at the top tell you what
        the object *does*; the private ones below show *how*.

      ### `protected` (rare)

      Ruby also has `protected`. It allows calls between instances of the
      same class but blocks external callers. Useful when objects compare
      themselves to siblings (`<=>`, `==`). For everyday code, `private`
      is what you reach for.

      ### Pitfall: `self.method` inside the class

      You **cannot** call a private method with an explicit `self.` (with
      one exception for `self.attr=` setters in Ruby 2.7+). Inside the
      class, just call the method without a receiver.

      ```ruby
      private
      def valid?; true; end

      # in another method of the same class:
      valid?         # works
      self.valid?    # NoMethodError: private method
      ```
    activities:
    - title: Hide a helper
      kind: code
      difficulty: 2
      prompt: Define `Greeter` with a public `greet(name)` that returns "hi, NAME"
        with the name capitalized via a `private` helper called `format(name)`. Calling
        `Greeter.new.format("alice")` from outside must raise NoMethodError.
      starter_code: |
        class Greeter
          def greet(name)
            # TODO
          end

          # define a private format helper
        end
      solution: |
        class Greeter
          def greet(name)
            "hi, " + format(name)
          end

          private

          def format(name)
            name.capitalize
          end
        end
      spec_code: |
        g = Greeter.new
        raise unless g.greet("alice") == "hi, Alice"
        begin
          g.format("alice")
          raise "format should be private"
        rescue NoMethodError
          :ok
        end
    - title: Calling private from inside
      kind: choice
      difficulty: 2
      prompt: Inside another method of the same class, how do you call a private method
        `format`?
      choices:
        a: self.format(...)
        b: format(...)
        c: private.format(...)
        d: instance_method(:format).call(...)
      correct_choice: b
    - title: Public surface
      kind: code
      difficulty: 3
      prompt: Define `Cart` with public `add(item)` (appends to `@items`) and public
        `total` (sum of item prices). The item-price logic must live in a `private`
        method `price_of(item)` which returns `item[:price]`.
      starter_code: |
        class Cart
          def initialize
            @items = []
          end

          def add(item)
            # TODO
          end

          def total
            # TODO
          end

          # define a private price_of helper
        end
      solution: |
        class Cart
          def initialize
            @items = []
          end

          def add(item)
            @items << item
          end

          def total
            @items.sum { |i| price_of(i) }
          end

          private

          def price_of(item)
            item[:price]
          end
        end
      spec_code: |
        c = Cart.new
        c.add(price: 5)
        c.add(price: 10)
        raise unless c.total == 15
        begin
          c.price_of(price: 1)
          raise "price_of should be private"
        rescue NoMethodError
          :ok
        end
  position: 0
- slug: single-responsibility
  name: Single Responsibility
  overview: |
    A class should have one reason to change. Try to describe what it
    does in a single sentence — if you have to say "and" or "or", it's
    probably doing too much.
  lessons:
  - slug: srp-violation
    title: Spotting an SRP violation
    body: |
      ## Single Responsibility Principle (SRP)

      ### What's a class for?

      A class bundles **data** and **behavior** that belong
      together. The longer it lives, the more pressure it feels to
      grow. New requirements arrive. People add methods. Before you
      know it, a single class does five unrelated things.

      The Single Responsibility Principle is a check against that
      growth: **a class should have one reason to change**. Said
      another way — if you can describe what the class does in one
      sentence without using "and" or "or", you're probably fine. If
      you need conjunctions, the class is doing too much.

      ### A class that does too much

      Look at this `Invoice`:

      ```ruby
      class Invoice
        def initialize(customer, lines)
          @customer = customer
          @lines    = lines
        end

        def total
          @lines.sum { |l| l[:qty] * l[:price] }
        end

        def to_pdf
          # render headers, draw the table, embed the company logo,
          # ship the bytes to a file
        end

        def email_to_customer
          # build an HTML body, attach the PDF, open an SMTP socket,
          # talk to the mail server
        end
      end
      ```

      What does it do? It **calculates totals AND renders PDFs AND
      sends mail**. Three jobs, three reasons to change:

      1. The pricing rules change (tax law, discounts).
      2. The marketing team wants a new PDF style.
      3. Operations switches SMTP providers.

      Worse, those reasons share **no logic**. Touching the PDF
      renderer to add a logo shouldn't risk breaking the total. But
      here they all live in the same class — so they share tests,
      they share dependencies, and they often share state.

      ### Why this matters

      - **Hard to test**: to test `total`, you might end up loading
        PDF libraries or stubbing the mailer.
      - **Hard to reuse**: you can't ask `Invoice` to render a PDF
        without also pulling in mail logic.
      - **Hard to change**: a small change to one responsibility
        risks the others — code review is slower because reviewers
        have to think about all three.

      ### The fix (preview)

      Split each job into its own class. `Invoice` keeps the money.
      A separate `InvoiceRenderer` does PDFs. A separate
      `InvoiceMailer` does delivery. The next lesson walks through
      that refactor.
    activities:
    - title: One-sentence test
      kind: choice
      difficulty: 2
      prompt: |
        Why does the `Invoice` class above fail the one-sentence
        test?
      choices:
        a: It uses `sum` instead of a manual loop.
        b: It calculates totals, renders PDFs, and sends mail — three responsibilities.
        c: It uses `@` instance variables instead of accessors.
        d: It doesn't define an initializer.
      correct_choice: b
    - title: Reasons to change
      kind: choice
      difficulty: 2
      prompt: |
        Which scenario should NOT require touching `Invoice` in
        a well-factored design?
      choices:
        a: The company changes pricing rules.
        b: The PDF style gets redesigned.
        c: A new currency is added.
        d: The line-total formula changes.
      correct_choice: b
    - title: Find the verbs
      kind: choice
      difficulty: 2
      prompt: |
        A class called `UserOnboarding` exposes these methods:
        `create_user`, `send_welcome_email`, `bill_first_month`,
        `notify_slack`. How many responsibilities is this?
      choices:
        a: One — it onboards users.
        b: At least four — each verb is a different concern.
        c: Two — creation and notification.
        d: None — these are just methods.
      correct_choice: b
    - title: One-line role
      kind: code
      difficulty: 2
      prompt: |
        The class below mixes two jobs. Write a description that
        summarizes ONLY its first job (computing the total). Your
        method `role` should return the string
        `"computes the invoice total"`.
      starter_code: |
        class TwoJobInvoice
          def initialize(lines); @lines = lines; end

          def total
            @lines.sum { |l| l[:qty] * l[:price] }
          end

          def to_pdf
            "PDF bytes"
          end
        end

        def role
          # TODO: return the single-sentence description
          # of just the money-computing responsibility
        end
      solution: |
        class TwoJobInvoice
          def initialize(lines); @lines = lines; end
          def total
            @lines.sum { |l| l[:qty] * l[:price] }
          end
          def to_pdf
            "PDF bytes"
          end
        end

        def role
          "computes the invoice total"
        end
      spec_code: 'raise unless role == "computes the invoice total"

'
  - slug: extract-collaborator
    title: Extract a collaborator
    body: |
      ## Pulling responsibilities apart

      So `Invoice` does too much. How do you fix it?

      The refactor pattern is: **extract a class** for each extra
      responsibility, then have the original class **delegate** to
      it (or to its caller, if neither object should own the new
      one).

      ### Step 1: Identify the seams

      From the previous lesson, the three jobs were: money, PDFs,
      mail. So you'll have three classes. `Invoice` keeps the money.
      A new `InvoiceRenderer` owns PDFs. A new `InvoiceMailer` owns
      delivery.

      ### Step 2: Name them by responsibility

      A useful tactic is to pick a noun for each new class that
      describes its **single job**:

      ```ruby
      class InvoiceRenderer
        def initialize(invoice)
          @invoice = invoice
        end

        def to_pdf
          # render the PDF using @invoice's data
        end
      end

      class InvoiceMailer
        def initialize(invoice, transport: SMTP)
          @invoice, @transport = invoice, transport
        end

        def deliver_to(customer)
          # build, attach PDF, send via @transport
        end
      end
      ```

      Each new class holds the original invoice as a collaborator
      and asks it for the data it needs (the `total`, the line
      items). Notice neither of them mutates `Invoice` — they only
      *read* it.

      ### Step 3: Slim down the original

      With the extracts in place, `Invoice` shrinks back to just its
      job:

      ```ruby
      class Invoice
        def initialize(customer, lines)
          @customer = customer
          @lines    = lines
        end

        def total
          @lines.sum { |l| l[:qty] * l[:price] }
        end
      end
      ```

      ### Why this is better

      - The class names tell you exactly what to expect.
      - Tests for `Invoice` no longer need a PDF library.
      - You can run `InvoiceRenderer` against any object that
        responds to `total`, `line_items`, etc. — that's the seed of
        a *duck type* (you'll meet that idea later).

      ### A working example to refactor

      The next activity gives you a `Notifier` that formats AND
      delivers. You'll extract the formatting into its own class so
      either responsibility can change without dragging the other
      along.
    activities:
    - title: Split Notifier
      kind: code
      difficulty: 2
      prompt: |
        `Notifier` formats a message AND sends it. Split it so
        `Notifier#deliver` formats the body via a separate
        `Formatter` class. Keep `Notifier`'s public API as
        `deliver(name)`. Pass a `Formatter` in at construction
        time with a default.
      starter_code: |
        class Notifier
          def initialize(sink)
            @sink = sink
          end

          def deliver(name)
            body = "hi, #{name.upcase}!"
            @sink << body
            body
          end
        end

        # write the Formatter class here
      solution: |
        class Formatter
          def call(name)
            "hi, #{name.upcase}!"
          end
        end

        class Notifier
          def initialize(sink, formatter: Formatter.new)
            @sink, @formatter = sink, formatter
          end

          def deliver(name)
            body = @formatter.call(name)
            @sink << body
            body
          end
        end
      spec_code: |
        sink = []
        n = Notifier.new(sink)
        raise unless n.deliver("alice") == "hi, ALICE!"
        raise unless sink == ["hi, ALICE!"]
        raise unless defined?(Formatter)
    - title: Why extract?
      kind: choice
      difficulty: 2
      prompt: |
        You extracted `InvoiceRenderer` out of `Invoice`. Which
        statement is the strongest benefit?
      choices:
        a: You can now subclass `Invoice` to add PDF support.
        b: PDF changes no longer risk breaking total calculation, and the renderer
          can be reused for any object that exposes the same data.
        c: PDFs are now generated faster.
        d: Ruby requires it for invoices over $100.
      correct_choice: b
    - title: Swap the formatter
      kind: code
      difficulty: 3
      prompt: |
        Given the `Notifier` from the previous activity, write a
        `LoudFormatter` whose `call(name)` returns
        `"HI, NAME!!!"` (uppercase name, three exclamation
        points). Then verify that `Notifier.new(sink, formatter:
        LoudFormatter.new).deliver("alice")` returns
        `"HI, ALICE!!!"`.
      starter_code: |
        class Formatter
          def call(name); "hi, #{name.upcase}!"; end
        end

        class Notifier
          def initialize(sink, formatter: Formatter.new)
            @sink, @formatter = sink, formatter
          end

          def deliver(name)
            body = @formatter.call(name)
            @sink << body
            body
          end
        end

        # write LoudFormatter here
      solution: |
        class Formatter
          def call(name); "hi, #{name.upcase}!"; end
        end

        class Notifier
          def initialize(sink, formatter: Formatter.new)
            @sink, @formatter = sink, formatter
          end

          def deliver(name)
            body = @formatter.call(name)
            @sink << body
            body
          end
        end

        class LoudFormatter
          def call(name)
            "HI, #{name.upcase}!!!"
          end
        end
      spec_code: |
        sink = []
        n = Notifier.new(sink, formatter: LoudFormatter.new)
        raise unless n.deliver("alice") == "HI, ALICE!!!"
        raise unless sink == ["HI, ALICE!!!"]
  position: 1
- slug: dependencies
  name: Managing Dependencies
  overview: |
    Objects depend on class names, message names, argument orders, and
    argument types. Each dependency is a risk. Reduce dependencies so
    objects only know what they need.
  lessons:
  - slug: dependency-injection
    title: Inject collaborators
    body: |
      ## Dependency injection

      ### What's a dependency, anyway?

      A class **depends on** another whenever it knows *something
      specific* about it. There are four common kinds of dependency:

      1. **The other class's name** — `Sms.new` mentions `Sms`.
      2. **The other class's message names** — calling `send_to`
         means you depend on that method existing.
      3. **The argument order** — `send_to(phone, body)` ties
         callers to that order.
      4. **The argument types** — `send_to(Phone.new(...), ...)`
         ties callers to the `Phone` class.

      Each dependency is a *risk*: if anything about the other
      class changes, your class might break.

      ### A tightly coupled example

      ```ruby
      class OrderConfirmation
        def deliver(order)
          Sms.new.send_to(order.phone, "order #{order.id} confirmed")
        end
      end
      ```

      Count the dependencies on the `Sms` class alone:

      - Knows the **name** `Sms`.
      - Knows it responds to `new` with no arguments.
      - Knows it responds to `send_to(phone, body)`.
      - Knows the argument **order**.

      If anyone renames `Sms`, changes its constructor, or reorders
      the arguments — this class breaks.

      ### The fix: pass it in

      Instead of constructing the collaborator inside, **accept it
      as an argument** (usually through `initialize`):

      ```ruby
      class OrderConfirmation
        def initialize(channel: Sms.new)
          @channel = channel
        end

        def deliver(order)
          @channel.send_to(order.phone, "order #{order.id} confirmed")
        end
      end
      ```

      Now `OrderConfirmation` only knows it has *something that
      responds to `send_to(phone, body)`*. The `Sms` class name
      appears in the **default**, not in the body of the method —
      so callers can swap in any other channel without touching this
      class:

      ```ruby
      OrderConfirmation.new(channel: Email.new)
      OrderConfirmation.new(channel: PushNotification.new)
      OrderConfirmation.new(channel: FakeChannel.new)   # for tests
      ```

      ### Why this matters

      - Tests get easier — pass a fake `channel` that just records
        calls. No SMTP, no network.
      - You can add new channels (push, slack, webhook) without
        opening `OrderConfirmation`.
      - The single test of "deliver builds the right message body"
        doesn't care which transport runs underneath.

      ### Rule of thumb

      When you find yourself writing `SomeClass.new(...)` inside
      another class, ask: **could the caller decide which class to
      use?** If yes, inject it.
    activities:
    - title: Why injection?
      kind: choice
      difficulty: 2
      prompt: |
        What's the main benefit of injecting `@channel` instead of
        constructing it inside `OrderConfirmation`?
      choices:
        a: The code runs faster.
        b: OrderConfirmation no longer depends on a specific class name — any object
          that responds to `send_to` works.
        c: It removes the need for `def initialize`.
        d: Ruby requires it for keyword arguments.
      correct_choice: b
    - title: Inject the clock
      kind: code
      difficulty: 2
      prompt: |
        `Greeter#hello` currently calls `Time.now` directly, which
        makes testing time-dependent behavior hard. Refactor
        `Greeter` so it accepts a `clock` collaborator at
        construction time (default `Time`). Then `#hello` should
        call `@clock.now.hour` instead of `Time.now.hour`.
      starter_code: |
        class Greeter
          def hello
            Time.now.hour < 12 ? "good morning" : "good afternoon"
          end
        end
      solution: |
        class Greeter
          def initialize(clock: Time)
            @clock = clock
          end

          def hello
            @clock.now.hour < 12 ? "good morning" : "good afternoon"
          end
        end
      spec_code: |
        # A fake clock fixed at 9 a.m.
        fake = Object.new
        def fake.now
          t = Object.new
          def t.hour; 9; end
          t
        end
        raise unless Greeter.new(clock: fake).hello == "good morning"

        # And one fixed at 3 p.m.
        fake_pm = Object.new
        def fake_pm.now
          t = Object.new
          def t.hour; 15; end
          t
        end
        raise unless Greeter.new(clock: fake_pm).hello == "good afternoon"
    - title: Spot the hard-coded dependency
      kind: choice
      difficulty: 2
      prompt: |
        Look at this method. Which line is the *strongest* source
        of coupling?
        ```ruby
        class Report
          def render(rows)
            data = JSON.generate(rows)
            HTTP::POST.new("/upload", data).call
          end
        end
        ```
      choices:
        a: "`JSON.generate(rows)` — JSON is a hard dependency."
        b: '`HTTP::POST.new("/upload", ...)` — this hard-codes both the class and
          the URL.'
        c: "`def render(rows)` — the method name is too generic."
        d: "`Report` shouldn't exist at all."
      correct_choice: b
    - title: Inject the storage
      kind: code
      difficulty: 3
      prompt: |
        `Saver` writes to a hard-coded `Disk.write`. Refactor so
        it accepts a `store` collaborator at construction time
        (default `Disk`). `#save(key, value)` should call
        `@store.write(key, value)` and return whatever the store
        returns.
      starter_code: |
        module Disk
          def self.write(key, value)
            "wrote #{key}=#{value} to disk"
          end
        end

        class Saver
          def save(key, value)
            Disk.write(key, value)
          end
        end
      solution: |
        module Disk
          def self.write(key, value)
            "wrote #{key}=#{value} to disk"
          end
        end

        class Saver
          def initialize(store: Disk)
            @store = store
          end

          def save(key, value)
            @store.write(key, value)
          end
        end
      spec_code: |
        raise unless Saver.new.save("k", "v") == "wrote k=v to disk"

        # Swap in an in-memory store for tests
        class MemStore
          attr_reader :written
          def initialize; @written = {}; end
          def write(key, value); @written[key] = value; "ok"; end
        end
        mem = MemStore.new
        raise unless Saver.new(store: mem).save("k", 1) == "ok"
        raise unless mem.written == { "k" => 1 }
  - slug: hash-arguments
    title: Hash arguments remove order coupling
    body: |
      ## From positional to keyword arguments

      When you write a method like this:

      ```ruby
      def initialize(name, age, role)
        @name, @age, @role = name, age, role
      end
      ```

      …every caller must know the **exact order** of arguments:

      ```ruby
      Member.new("alice", 30, :admin)
      ```

      If next week you decide `role` belongs earlier, or you want to
      add a new field, every call site has to change. That's *order
      coupling*.

      ### Keyword arguments

      Keyword args name each value at the call site:

      ```ruby
      def initialize(name:, age:, role:)
        @name, @age, @role = name, age, role
      end

      Member.new(name: "alice", age: 30, role: :admin)
      ```

      Two things become easier:

      - **Callers don't care about order.** They can write `role:`
        first, or in any order — the names disambiguate.
      - **You can add new fields without breaking existing callers**
        (give them defaults). Want to add `team:`? Existing call
        sites continue to work.

      ### When positional is fine

      For methods with **one** argument (or one obvious argument),
      positional is fine: `square(4)`, `greet("alice")`,
      `Wallet.new(100)`.

      The cost-benefit tilts toward keyword args around 3+ arguments
      or when the meaning of any argument isn't obvious from its
      value at the call site.

      ### Required vs. optional

      Add a trailing colon to make a keyword **required** (Ruby
      raises `ArgumentError` if missing):

      ```ruby
      def shift(point, by:)              # by is required
        point + by
      end
      ```

      Add a default value to make it **optional**:

      ```ruby
      def shift(point, by: 1)            # by is optional
        point + by
      end
      ```
    activities:
    - title: Convert to keyword args
      kind: code
      difficulty: 2
      prompt: |
        Rewrite `Member#initialize` to use *required* keyword args
        for `name`, `age`, and `role`. The accessors stay the
        same.
      starter_code: |
        class Member
          attr_reader :name, :age, :role
          def initialize(name, age, role)
            @name, @age, @role = name, age, role
          end
        end
      solution: |
        class Member
          attr_reader :name, :age, :role
          def initialize(name:, age:, role:)
            @name, @age, @role = name, age, role
          end
        end
      spec_code: |
        m = Member.new(name: "alice", age: 30, role: :admin)
        raise unless m.name == "alice"
        raise unless m.age  == 30
        raise unless m.role == :admin
        n = Member.new(role: :admin, name: "alice", age: 30)
        raise unless n.name == "alice"
    - title: Order coupling
      kind: choice
      difficulty: 1
      prompt: |
        You change `def initialize(name, age, role)` to
        `def initialize(name, role, age)` — only the order of
        `role` and `age` changed. What happens?
      choices:
        a: Nothing — Ruby figures it out by name.
        b: All existing callers now silently swap age and role values, producing wrong
          data.
        c: Ruby raises an ArgumentError everywhere.
        d: Only new callers are affected.
      correct_choice: b
    - title: Mixed signature
      kind: code
      difficulty: 3
      prompt: |
        Write `register(email, name:, admin: false)` that returns
        a hash with `:email`, `:name`, `:admin` keys filled from
        the arguments. `email` is positional, the other two are
        keyword args; `admin` defaults to `false`.
      starter_code: |
        def register(email, name:, admin: false)
          # TODO
        end
      solution: |
        def register(email, name:, admin: false)
          { email: email, name: name, admin: admin }
        end
      spec_code: |
        raise unless register("a@x", name: "alice")               == { email: "a@x", name: "alice", admin: false }
        raise unless register("b@x", name: "bob", admin: true)    == { email: "b@x", name: "bob",   admin: true  }
  position: 2
- slug: interfaces
  name: Interfaces
  overview: |
    The public interface is the contract — what other objects can ask
    this object to do. Keep it small, intentional, and stable. Hide
    internals so you can change them without breaking callers.
  lessons:
  - slug: tell-dont-ask
    title: Tell, don't ask
    body: |
      ## Tell, don't ask

      When you see code like this, your design alarm should go off:

      ```ruby
      if account.balance >= amount
        account.balance -= amount
      else
        raise InsufficientFunds
      end
      ```

      The caller is **asking** the account for state, **making a
      decision**, then **mutating** the account. That's three things
      happening at one level above the data — and any other place
      that wants to withdraw money has to re-implement the same
      dance.

      ### What "tell, don't ask" means

      Instead of asking for state and acting on it, **tell the
      object what you want**. Let it decide:

      ```ruby
      account.withdraw(amount)   # raises if not enough
      ```

      Now the rule about insufficient funds lives **next to the
      balance**. Other code calling `withdraw` doesn't need to know
      the rule.

      ### Why this matters

      - **Encapsulation**: `account` is the only place that touches
        its balance. If you want to add an overdraft fee or audit
        log, you change it in one place.
      - **Smaller callers**: every "I want to spend money" site
        becomes one line.
      - **Easier to reason about**: when you read `account.withdraw`
        you don't need to wonder *what* the caller might have done
        differently — there's one withdrawal path.

      ### When asking is OK

      "Tell, don't ask" isn't an absolute rule. There are legitimate
      reasons to read state — display, search, validation that
      spans multiple objects. The rule is more useful as a **smell
      detector** than as a law:

      > If your caller reads a value, branches on it, then writes
      > back to the same object — the logic probably belongs in the
      > object, not the caller.

      ### Demeter — a related rule of thumb

      A related principle says: **talk only to your immediate
      neighbors**. If you find yourself writing
      `customer.profile.address.city.country.code`, you're reaching
      past several objects. Each `.` is a dependency on the structure
      of the object before it. A small change anywhere in that chain
      breaks the caller. Prefer a method on `customer` (like
      `country_code`) that hides the structure.
    activities:
    - title: Refactor to tell, don't ask
      kind: code
      difficulty: 3
      prompt: |
        Replace the body of `pay` so it tells the wallet to
        `charge` `amount`, instead of inspecting `wallet.balance`
        and mutating it. `Wallet#charge` already exists and raises
        `RuntimeError` when the balance is too low.
      starter_code: |
        class Wallet
          attr_reader :balance
          def initialize(balance); @balance = balance; end

          def charge(amount)
            raise "insufficient" if amount > @balance
            @balance -= amount
            amount
          end
        end

        def pay(wallet, amount)
          if wallet.balance >= amount
            amount
          else
            raise "insufficient"
          end
        end
      solution: |
        class Wallet
          attr_reader :balance
          def initialize(balance); @balance = balance; end

          def charge(amount)
            raise "insufficient" if amount > @balance
            @balance -= amount
            amount
          end
        end

        def pay(wallet, amount)
          wallet.charge(amount)
        end
      spec_code: |
        w = Wallet.new(100)
        raise unless pay(w, 30) == 30
        raise unless w.balance == 70
        begin
          pay(w, 500)
          raise "should have raised"
        rescue RuntimeError
          :ok
        end
    - title: Demeter smell
      kind: choice
      difficulty: 2
      prompt: |
        Which of these expressions most strongly violates the Law
        of Demeter ("talk only to your neighbors")?
      choices:
        a: order.customer.address.country.code
        b: order.total
        c: order.line_items.length
        d: order.confirm!
      correct_choice: a
    - title: Move the rule
      kind: code
      difficulty: 3
      prompt: |
        `apply_discount` currently reads `cart.subtotal` and
        branches outside the cart. Add a `Cart#apply_discount`
        method that subtracts 10% if subtotal ≥ 100, otherwise
        leaves it alone. The method should return the final
        total. Then `apply_discount(cart)` becomes a one-liner.
      starter_code: |
        class Cart
          attr_accessor :subtotal
          def initialize(subtotal); @subtotal = subtotal; end
        end

        def apply_discount(cart)
          if cart.subtotal >= 100
            cart.subtotal = cart.subtotal * 0.9
          end
          cart.subtotal
        end
      solution: |
        class Cart
          attr_accessor :subtotal
          def initialize(subtotal); @subtotal = subtotal; end

          def apply_discount
            @subtotal = @subtotal * 0.9 if @subtotal >= 100
            @subtotal
          end
        end

        def apply_discount(cart)
          cart.apply_discount
        end
      spec_code: |
        c = Cart.new(200)
        raise unless apply_discount(c) == 180.0
        raise unless c.subtotal == 180.0

        c2 = Cart.new(50)
        raise unless apply_discount(c2) == 50
        raise unless c2.subtotal == 50
  position: 3
- slug: duck-typing
  name: Duck Typing
  overview: |
    Don't ask "what class is this?" — ask "what messages does it
    respond to?". If many classes share a method, that method is a
    duck type waiting to be named.
  lessons:
  - slug: spot-the-duck
    title: Find the duck
    body: |
      ## Duck typing

      ### The dictionary definition

      > If it walks like a duck and quacks like a duck, it's a duck.

      In static languages, you declare types — `String`, `Integer`,
      `Customer`. In Ruby, what matters at runtime is **what messages
      an object responds to**, not what class it belongs to. Any
      object that responds to `each` can be iterated; any object
      that responds to `to_s` can be printed. That's duck typing.

      ### What it looks like

      Compare two ways of writing the same code.

      **Without duck typing**, you switch on class:

      ```ruby
      def render(report)
        case report
        when DailyReport   then DailyRenderer.new.render(report)
        when WeeklyReport  then WeeklyRenderer.new.render(report)
        when MonthlyReport then MonthlyRenderer.new.render(report)
        end
      end
      ```

      Every new report type means editing `render`.

      **With duck typing**, ask each report to render itself:

      ```ruby
      def render(report)
        report.render
      end
      ```

      Now `DailyReport`, `WeeklyReport`, `MonthlyReport` each
      implement `#render` differently. Adding a new report type
      means adding a new class with a `#render` method — no edits
      to the caller.

      ### Smell: `case … when SomeClass`

      A `case` (or `if`) that switches on `is_a?` or class names is
      almost always a duck type waiting to be extracted. Each branch
      can become a method on the object itself.

      ### Recognizing ducks

      Look for clusters where:

      - Multiple classes implement the **same method** with the same
        shape (`#render`, `#price`, `#deliver`).
      - Callers have to **branch** based on which class came in.
      - You feel the urge to add an `if` to support a new type.

      Each cluster is a duck type. Name it (e.g. "Printable") and
      let polymorphism do the work.
    activities:
    - title: case-when-class smell
      kind: choice
      difficulty: 2
      prompt: 'You see `case x when SomeClass`. It usually signals…

'
      choices:
        a: A missing private method.
        b: A duck type — every branch can become a method on the object.
        c: A circular require.
        d: Ruby being slow.
      correct_choice: b
    - title: Find a duck name
      kind: choice
      difficulty: 2
      prompt: |
        Three classes — `Email`, `Sms`, `PushNotification` — each
        implement `#deliver(message)`. What's the *role* (duck
        type) they share?
      choices:
        a: Message
        b: Channel — anything that knows how to deliver a message.
        c: EmailLike
        d: Sender
      correct_choice: b
    - title: Replace the case
      kind: code
      difficulty: 3
      prompt: |
        `total(items)` switches on class to compute prices.
        Refactor each item class to define its own `price` method,
        then `total(items)` should just `sum(&:price)`.
      starter_code: |
        class Apple
          def initialize(weight); @weight = weight; end
          attr_reader :weight
        end

        class Book
          def initialize(price); @price = price; end
          attr_reader :price
        end

        def total(items)
          items.sum do |item|
            case item
            when Apple then item.weight * 2
            when Book  then item.price
            end
          end
        end
      solution: |
        class Apple
          def initialize(weight); @weight = weight; end
          def price; @weight * 2; end
        end

        class Book
          def initialize(price); @price = price; end
          attr_reader :price
        end

        def total(items)
          items.sum(&:price)
        end
      spec_code: |
        items = [Apple.new(3), Book.new(10), Apple.new(2)]
        raise unless total(items) == 3 * 2 + 10 + 2 * 2
  position: 4
- slug: inheritance
  name: Inheritance
  overview: |
    Classical inheritance models IS-A relationships. The parent
    describes the algorithm; subclasses specialize the parts that
    differ.
  lessons:
  - slug: inheritance-basics
    title: Inheritance basics
    body: |
      ## Inheritance basics

      Inheritance lets one class **build on** another. The child class
      starts with everything the parent has, then adds or overrides what
      needs to differ.

      ### Syntax

      ```ruby
      class Animal
        def initialize(name)
          @name = name
        end

        def name
          @name
        end

        def speak
          "some sound"
        end
      end

      class Dog < Animal           # Dog inherits from Animal
        def speak
          "woof"                   # overrides parent's speak
        end
      end

      d = Dog.new("rex")
      d.name        # => "rex"     (inherited)
      d.speak       # => "woof"    (overridden)
      ```

      Use `<` between child and parent. Every Ruby class inherits from
      something — by default, from `Object`.

      ### Override what differs, inherit what doesn't

      In the example above, `Dog` didn't redefine `initialize` or `name`
      — it gets them for free. Only `speak` changed.

      ### When inheritance fits

      Use inheritance when there's a real "is-a" relationship:

      - `Dog` *is an* `Animal`. ✓
      - `SavingsAccount` *is an* `Account`. ✓
      - `Cart` *has* `Items`, not "is an" item. ✗ Use composition.

      If you're tempted to use inheritance just to share code, ask whether
      composition (an object holding another object) would fit better.

      ### Pitfall: deep hierarchies

      Inheritance is rigid. Each layer adds coupling. Two or three levels
      is usually plenty. If you find yourself building a 5-level deep
      tower, redesign with composition or modules.

      ### What's `super`?

      When you override a method, you sometimes want to **also** call the
      parent's version. That's `super` — the next lesson covers it.
    activities:
    - title: Inherit a method
      kind: code
      difficulty: 1
      prompt: Define `Animal` with a `name` method that returns `@name` (set in initialize).
        Then define `Cat < Animal` that overrides `speak` to return `"meow"` while
        inheriting `name`.
      starter_code: |
        class Animal
          def initialize(name); @name = name; end
          def name; @name; end
          def speak; "some sound"; end
        end

        # write Cat here
      solution: |
        class Animal
          def initialize(name); @name = name; end
          def name; @name; end
          def speak; "some sound"; end
        end

        class Cat < Animal
          def speak
            "meow"
          end
        end
      spec_code: |
        c = Cat.new("whiskers")
        raise unless c.name  == "whiskers"
        raise unless c.speak == "meow"
        raise unless c.is_a?(Animal)
    - title: Is-a relationship
      kind: choice
      difficulty: 2
      prompt: Which pair is the strongest candidate for inheritance?
      choices:
        a: Cart and Item — a cart holds items
        b: SavingsAccount and Account — a savings account is an account
        c: Order and Mailer — orders send mail
        d: User and Hash — both hold key/value data
      correct_choice: b
    - title: Override only what differs
      kind: code
      difficulty: 2
      prompt: Define `Vehicle` with `wheels` returning 4. Then define `Motorcycle
        < Vehicle` overriding `wheels` to return 2. Both should respond to `wheels`
        correctly.
      starter_code: |
        class Vehicle
          def wheels; 4; end
        end

        # write Motorcycle here
      solution: |
        class Vehicle
          def wheels; 4; end
        end

        class Motorcycle < Vehicle
          def wheels; 2; end
        end
      spec_code: |
        raise unless Vehicle.new.wheels    == 4
        raise unless Motorcycle.new.wheels == 2
        raise unless Motorcycle.new.is_a?(Vehicle)
  - slug: super-keyword
    title: The super keyword
    body: |
      ## The `super` keyword

      When you override a method in a subclass, you sometimes still want
      the parent's version to run too. `super` is how you call it.

      ### Basic use

      ```ruby
      class Animal
        def speak
          "some sound"
        end
      end

      class Dog < Animal
        def speak
          parent_sound = super       # calls Animal#speak
          "#{parent_sound} and woof"
        end
      end

      Dog.new.speak    # => "some sound and woof"
      ```

      Bare `super` passes the **same arguments** the current method
      received. `super()` with empty parens passes **no** arguments.
      `super(x, y)` passes specific ones.

      ### Common pattern: extend `initialize`

      Subclasses often need their own state on top of the parent's. Call
      `super` to let the parent set up its fields:

      ```ruby
      class Vehicle
        def initialize(wheels)
          @wheels = wheels
        end
      end

      class Car < Vehicle
        def initialize(wheels, color)
          super(wheels)        # parent sets @wheels
          @color = color       # we set @color
        end
      end
      ```

      ### Where does `super` look?

      Ruby walks the **ancestor chain** — the parent class, then *its*
      parent, then included modules. The first matching method is the one
      `super` calls.

      ```ruby
      Dog.ancestors
      # => [Dog, Animal, Object, Kernel, BasicObject]
      ```

      ### Pitfall: bare `super` with no args

      Bare `super` (no parens) **passes through** the current method's
      arguments. If you want to call the parent without arguments, write
      `super()`.

      ```ruby
      def initialize(name)
        super        # passes `name` — usually what you want
        super()      # passes NOTHING
      end
      ```
    activities:
    - title: Extend a behavior
      kind: code
      difficulty: 2
      prompt: Define `Greeter` with `greet` returning "hi". Then define `LoudGreeter
        < Greeter` whose `greet` returns the parent's greeting upcased plus "!". `LoudGreeter.new.greet`
