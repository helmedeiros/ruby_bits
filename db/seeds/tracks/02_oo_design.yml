          attr_reader :cents
          def initialize(cents); @cents = cents; end
          def <=>(other); cents <=> other.cents; end
        end
      spec_code: |
        raise unless Money.new(50).between?(Money.new(10), Money.new(100))
        raise     if Money.new(5).between?(Money.new(10), Money.new(100))
        raise unless Money.new(100).clamp(Money.new(0), Money.new(50)).cents == 50
  position: 6
- slug: composition
  name: Composition
  overview: |
    Composition models HAS-A. Objects collaborate by holding references
    to other objects. Prefer composition unless there's a true IS-A
    relationship.
  lessons:
  - slug: composition-over-inheritance
    title: Composition over inheritance
    body: |
      ## Composition over inheritance

      ### Two ways to share behavior

      Suppose you're building a checkout flow with several pricing
      strategies — fixed price, taxed, volume-discounted. There are
      two common ways to share behavior:

      **Inheritance**: `TaxedOrder < Order`. Every taxed order *is*
      an order, with tax behavior added.

      **Composition**: `Order` holds a *pricer*. The pricer
      calculates the total. Swap the pricer and the calculation
      changes; the Order doesn't.

      Both work for small examples. Composition tends to scale
      better.

      ### Why composition usually wins

      Inheritance is rigid: an object is either a `TaxedOrder` or
      not, forever. If next month you need "taxed AND
      volume-discounted", you're stuck building a combinatorial
      tower of subclasses (`TaxedDiscountedOrder`,
      `TaxedDiscountedPrimeOrder`, …).

      Composition is flexible: an `Order` can hold *any* pricer —
      fixed, taxed, discounted, or one you write today that combines
      two others. The structure of `Order` doesn't change.

      ### A concrete example

      ```ruby
      class Order
        def initialize(items:, pricer:)
          @items, @pricer = items, pricer
        end

        def total
          @pricer.total(@items)
        end
      end

      class FixedPricer
        def total(items)
          items.sum { |i| i[:price] }
        end
      end

      class TaxedPricer
        def initialize(rate); @rate = rate; end
        def total(items)
          items.sum { |i| i[:price] } * (1 + @rate)
        end
      end
      ```

      `Order` only knows it has *a pricer* — anything that responds
      to `total(items)`. The pricer can be as simple or as smart as
      you like. You can also compose pricers (e.g. a
      `DiscountedPricer` that wraps another pricer).

      ### Has-a vs is-a

      The shorthand test: ask "is this new class a more specific
      version of the parent, or does it just *have* one of those?".

      - `Cat` *is a* `Animal`. → inheritance is fine.
      - `Order` *has a* pricer. → composition.
      - `Car` *has an* engine. → composition.
      - `RoadBike` *is a* `Bicycle`. → either could work; composition
        often wins long-term because it stays flexible.

      ### When to still reach for inheritance

      Inheritance is great when you have:

      - A real **is-a** relationship.
      - A small (2-4) **closed** set of subclasses that won't
        multiply.
      - A clear template method or shared algorithm.

      Outside those cases, composition usually keeps your design
      friendlier to change.
    activities:
    - title: HAS-A vs IS-A
      kind: choice
      difficulty: 2
      prompt: |
        A `Car`, a `Truck`, and a `Bus` all have an engine and a
        gearbox, but those parts differ. How should you model the
        engine?
      choices:
        a: Superclass — Car IS-AN engine.
        b: Composed object — Car HAS-AN engine. Inject the engine into Car.
        c: Module mixed into every vehicle.
        d: Singleton method on each instance.
      correct_choice: b
    - title: Swap the pricer
      kind: code
      difficulty: 3
      prompt: |
        Given the `Order` class below (which already takes a
        pricer), write a `DiscountPricer.new(rate)` whose `#total`
        applies a `(1 - rate)` discount to the sum of item
        prices.
      starter_code: |
        class Order
          def initialize(items:, pricer:)
            @items, @pricer = items, pricer
          end

          def total
            @pricer.total(@items)
          end
        end

        class FixedPricer
          def total(items); items.sum { |i| i[:price] }; end
        end

        # write DiscountPricer here
      solution: |
        class Order
          def initialize(items:, pricer:)
            @items, @pricer = items, pricer
          end

          def total
            @pricer.total(@items)
          end
        end

        class FixedPricer
          def total(items); items.sum { |i| i[:price] }; end
        end

        class DiscountPricer
          def initialize(rate); @rate = rate; end
          def total(items)
            items.sum { |i| i[:price] } * (1 - @rate)
          end
        end
      spec_code: |
        items = [{ price: 100 }, { price: 50 }]
        raise unless Order.new(items: items, pricer: FixedPricer.new).total           == 150
        raise unless Order.new(items: items, pricer: DiscountPricer.new(0.1)).total   == 135.0
        raise unless Order.new(items: items, pricer: DiscountPricer.new(0.5)).total   == 75.0
    - title: When inheritance still fits
      kind: choice
      difficulty: 3
      prompt: |
        Which of these is the strongest candidate for inheritance
        rather than composition?
      choices:
        a: Three vehicle classes that each have a different engine.
        b: Four report formats that all follow the same render-header-body-footer
          algorithm with one varying body step.
        c: A checkout that needs to plug in a dozen pricing strategies over time.
        d: An audit log that should be optional on some entities.
      correct_choice: b
  position: 7
