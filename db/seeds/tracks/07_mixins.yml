---
slug: mixins
name: Mixins & Concerns
description: Share behaviour with modules — and know when not to.
position: 7
modules:
- slug: include-vs-extend
  name: include vs extend
  overview: |
    `include` brings instance methods into a class.
    `extend` brings methods in as singleton (class) methods.
  lessons:
  - slug: include
    title: include — instance methods
    body: |
      ## include

      ```ruby
      module Greetable
        def greet; "hi, #{name}"; end
      end

      class User
        include Greetable
        attr_accessor :name
      end

      User.new.tap { |u| u.name = 'alice' }.greet
      # => "hi, alice"
      ```
    activities:
    - title: Mixin via include
      kind: code
      prompt: Make `Robot` greet using the `Greetable` module already defined.
      starter_code: |
        module Greetable
          def greet; "hi, #{name}"; end
        end

        class Robot
          # TODO
          attr_accessor :name
        end
      solution: |
        module Greetable
          def greet; "hi, #{name}"; end
        end

        class Robot
          include Greetable
          attr_accessor :name
        end
      spec_code: |
        r = Robot.new; r.name = 'R2D2'
        raise unless r.greet == 'hi, R2D2'
  - slug: extend
    title: extend — single-instance / class methods
    body: |
      ## extend

      Inside a class body, `extend` adds the module's methods as
      **class-level** methods:

      ```ruby
      module Counters
        def count; @count ||= 0; end
        def bump; @count = count + 1; end
      end

      class Hit
        extend Counters
      end

      Hit.bump; Hit.count # => 1
      ```
    activities:
    - title: When extend?
      kind: choice
      prompt: |
        You want every subclass of `Logger` to expose a class-level
        `silence!` method. Which call adds it?
      choices:
        a: include Silenceable inside the class body
        b: extend Silenceable inside the class body
        c: prepend Silenceable inside the class body
        d: define_method :silence! inside the instance
      correct_choice: b
- slug: concerns
  name: Concerns
  overview: |-
    Hook methods and ActiveSupport::Concern flatten the awkward dance of
    mixing instance + class methods + included blocks into one tidy module.
  lessons:
  - slug: self-included
    title: self.included hook
    body: |
      ## self.included

      A module can react when something includes it by defining `self.included`:

      ```ruby
      module Counted
        def self.included(base)
          base.extend(ClassMethods)
        end

        module ClassMethods
          def count; @count ||= 0; end
        end
      end
      ```

      This is the trick `ActiveSupport::Concern` automates.
    activities:
    - title: Add a class-level helper via included
      kind: code
      prompt: Make `Trackable` add a class-level `tracked?` returning `true`.
      starter_code: |
        module Trackable
        end

        class Page
          include Trackable
        end
      solution: |
        module Trackable
          def self.included(base)
            base.extend(ClassMethods)
          end

          module ClassMethods
            def tracked?; true; end
          end
        end

        class Page
          include Trackable
        end
      spec_code: 'raise unless Page.tracked? == true

'
  - slug: active-support-concern
    title: ActiveSupport::Concern
    body: |
      ## ActiveSupport::Concern

      Replaces the `self.included`/`ClassMethods` boilerplate:

      ```ruby
      require "active_support/concern"

      module Trackable
        extend ActiveSupport::Concern

        included do
          after_save :touch_audit_log
        end

        class_methods do
          def tracked?; true; end
        end
      end
      ```

      `included do ... end` runs in the context of the *including class*.
      `class_methods do ... end` defines class-level helpers.
    activities:
    - title: Why use Concern?
      kind: choice
      prompt: Which problem does ActiveSupport::Concern solve?
      choices:
        a: It eliminates dependencies between mixin modules.
        b: It avoids the boilerplate of self.included + ClassMethods constant.
        c: It compiles modules into C extensions for speed.
        d: It allows duck typing between unrelated classes.
      correct_choice: b
